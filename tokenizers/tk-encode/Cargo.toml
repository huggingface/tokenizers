[package]
name = "tk-encode"
version = "0.1.0-rc.6.dev.0"
edition = "2024"
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Arthur Zucker <arthur@huggingface.co>",
  "Luc Georges <luc@huggingface.co>",
  "Simon Brandeis <simon@huggingface.co>",
]
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Inference (encode/decode) half of the 🤗 Tokenizers library: model engines,
the full pipeline components, and the `Tokenizer` orchestration — without any
training code.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tk_encode"
path = "src/lib.rs"

[dependencies]
############ Required dependencies ###############################
bitcannon = { path = "../bitcannon", version = "0.1.0-rc.6.dev.0" }
rand = "0.10"
ptr_hash = { version = "2.1.5", default-features = false }
unicode_categories = "0.1"
log = "0.4"
thiserror = "2"
ahash = "0.8.12"
memchr = "2.8.3"
wide = "1.6.1"
########### Optional dependencies ############################
rayon = { version = "1.12", optional = true }
rayon-cond = { version = "0.4", optional = true }
# Only `normalizers/precompiled.rs` reaches it, which is `normalizers`-gated.
unicode-segmentation = { version = "1.13", optional = true }
spm_precompiled = { version = "0.1.4", optional = true }
hf-hub = { version = "1.0.0", features = [
  "blocking",
  "rustls-tls",
], default-features = false, optional = true }
fancy-regex = { version = "0.19", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }
yada = { version = "0.7.0", optional = true }
# The n-best heap in `models/unigram/lattice.rs`, which is `unigram`-gated.
dary_heap = { version = "0.3.9", optional = true }
# One `#[cfg(unix)]` `pthread_atfork` call in `utils/parallelism.rs`, which is `parallelism`-gated.
libc = { version = "0.2", optional = true }

[features]
default = ["bpe"]
bpe = []
unigram = ["dep:dary_heap"]
wordpiece = ["dep:yada"]
wordlevel = []
# Digest-layout experiments for the long-word arm, all measured equivalent by the
# `lookup_throughput` bench (4.7-5.5 ns/lookup, i.e. within run noise); the difference is how many
# bits of verifier each one leaves:
#   default      1 bit of arm tag                                                          (63 bits)
#   len-byte     length in the top byte (8..254, `0xFF` escape for >= 255-byte tokens)      (56 bits)
#   len-digest   length reserved in bits 32..47, plus the arm tag                           (47 bits)
#   len-check    the default, plus a separate comparison against `spans[slot].len`  (63 bits, 2nd line)
len-byte = []
len-digest = []
# Experiment: keep all 63 bits of the digest and check the length separately, against `spans`.
# Prices the "extra compare" a length check really costs when the length is not in the digest.
len-check = []

normalizers = [
  "dep:unicode-normalization",
  "dep:spm_precompiled",
  "dep:unicode-segmentation",
]
unicode-scripts = []
http = ["hf-hub"]
parallelism = ["dep:rayon", "dep:rayon-cond", "dep:libc"]

[dev-dependencies]
# Test-only: one `#[cfg(test)]` cross-check in `vocab/buckets.rs`.
daachorse = "5.0.0"
assert_approx_eq = "1.1"
serde_json = "1.0"
