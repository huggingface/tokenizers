[package]
name = "tk-encode"
version = "0.23.2-dev.0"
edition = "2024"
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Inference (encode/decode) half of the 🤗 Tokenizers library: model engines,
the full pipeline components, and the `Tokenizer` orchestration — without any
training code.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tk_encode"
path = "src/lib.rs"

[dependencies]
atomsplit = { path = "../atomsplit" }
tk-serialization = { path = "../tk-serialization" }
rand = "0.9"
regex = "1.10"
rayon = { version = "1.10", optional = true }
rayon-cond = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
unicode-normalization-alignments = { version = "0.1", optional = true }
unicode_categories = "0.1"
unicode-segmentation = "1.11"
indicatif = { version = "0.18", optional = true }
itertools = "0.14"
log = "0.4"
derive_builder = "0.20"
spm_precompiled = { version = "0.1.3", optional = true }
hf-hub = { version = "0.4.1", features = [
  "ureq",
], default-features = false, optional = true }
daachorse = "3.0.0"
paste = "1.0.14"
macro_rules_attribute = "0.2.0"
thiserror = "2"
fancy-regex = { version = "0.17", optional = true }
getrandom = { version = "0.3" }
monostate = "0.1.12"
ahash = { version = "0.8.11" }
dary_heap = { version = "0.3.6" }
compact_str = { version = "0.9" }
# No `parallel`: the MPHF is built once at load, and rayon is 244 symbols we never run.
ptr_hash = { version = "2.0.1", default-features = false, features = ["elias-fano", "cacheline-ef"] }
memchr = "2.8.2"
unicode-normalization = { version = "0.1.25", optional = true }
yada = "0.7.0"

# Latest released tokenizers, used as the comparison baseline by the CI benchmark
# (examples gated on `bench-baseline`). Optional so production builds never pull it.
tokenizers-release = { package = "tokenizers", version = "=0.23.1", optional = true }
# Reference regex engines `fixture_bench` times the classify+fsm pre-tokenize against: Oniguruma and
# PCRE2 (both C) alongside the pure-Rust `fancy-regex` (optional, above). All three are pulled in by
# `bench-baseline` — optional + behind that feature so the C builds happen ONLY for the CI benchmark,
# never for `cargo test`/production.
onig = { version = "6.5.1", optional = true }
pcre2 = { version = "0.2", optional = true }
logos = { version = "0.15", optional = true } # compile-time DFA lexer reference (pure Rust)

[features]
# `fancy-regex` is the OPTIONAL system-regex backend, needed ONLY for a *regex* pattern in a `Split`
# pre-tokenizer or a `Replace` normalizer — the atomsplit-native pre-tokenizers (GPT-2, cl100k,
# deepseek, the class family, char-delimiter) need no backend, and a plain string pattern is searched
# for directly. Without it a stub compiles and those regex paths error at load. Enable with
# `--features fancy-regex`.
# Default is the v1 crate: reads a `.tok`, encodes, and links no parser.
default = ["progressbar"]
# `config` is the v0 layer — the legacy `tokenizer.json` reader, the wrapper enums, and every
# model / normalizer / pre-tokenizer variant they can hold. `tk-convert` turns it on to convert;
# nothing else should need it.
# The table-backed normalizers: NFC/NFD/NFKC/NFKD, StripAccents, Bert, and SentencePiece's
# precompiled charsmap. ~154 KB of static Unicode tables between them, so a `.tok` that names one
# is refused by a build without this rather than paying for it everywhere.
normalizers = [
  "dep:unicode-normalization",
  "dep:unicode-normalization-alignments",
  "dep:spm_precompiled",
]
config = [
  "normalizers",
  "dep:serde",
  "dep:serde_json",
  "dep:rayon",
  "dep:rayon-cond",
  "ahash/serde",
  "dary_heap/serde",
  "compact_str/serde",
]
# Writing a `.tok`. Only `tk-convert` needs it; an inference build reads and never writes.

progressbar = ["indicatif"]
http = ["hf-hub"]
unstable_wasm = ["fancy-regex", "getrandom/wasm_js"]
rustls-tls = ["hf-hub?/rustls-tls"]
bench-baseline = [
  "dep:tokenizers-release",
  "dep:onig",
  "dep:pcre2",
  "dep:logos",
  "fancy-regex",
]

[dev-dependencies]
criterion = "0.6"
tempfile = "3.10"
assert_approx_eq = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3.18"

[[bench]]
name = "pipeline_benchmark"
harness = false

[[bench]]
name = "bpe_model_benchmark"
required-features = ["http"]
harness = false

[[example]]
name = "binsize_tok"
required-features = []

[[example]]
name = "fixture_bench"
required-features = ["bench-baseline"]

[[example]]
name = "binsize_baseline"
required-features = ["bench-baseline"]
