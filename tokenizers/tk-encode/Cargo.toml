[package]
name = "tk-encode"
version = "0.23.2-dev.0"
edition = "2024"
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Inference (encode/decode) half of the 🤗 Tokenizers library: model engines,
the full pipeline components, and the `Tokenizer` orchestration — without any
training code.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tk_encode"
path = "src/lib.rs"

[dependencies]
atomsplit = { path = "../atomsplit" }
rand = "0.9"
rayon = { version = "1.10", optional = true }
rayon-cond = { version = "0.4", optional = true }
unicode-normalization-alignments = { version = "0.1", optional = true }
unicode_categories = "0.1"
# Only `normalizers/precompiled.rs` reaches it, which is `normalizers`-gated.
unicode-segmentation = { version = "1.11", optional = true }
indicatif = { version = "0.18", optional = true }
itertools = "0.14"
log = "0.4"
derive_builder = "0.20"
spm_precompiled = { version = "0.1.3", optional = true }
hf-hub = { version = "0.4.1", features = [
  "ureq",
], default-features = false, optional = true }
paste = "1.0.14"
macro_rules_attribute = "0.2.0"
thiserror = "2"
fancy-regex = { version = "0.17", optional = true }
# No source reference anywhere: this exists only so `unstable_wasm` can select the `wasm_js`
# backend for `rand`'s entropy source on that target.
getrandom = { version = "0.3", optional = true }
ahash = "0.8.11"
dary_heap = "0.3.6"
ptr_hash = { version = "2.0.1", default-features = false }
memchr = "2.8.2"
unicode-normalization = { version = "0.1.25", optional = true }
yada = { version = "0.7.0", optional = true }
# One `#[cfg(unix)]` `pthread_atfork` call in `utils/parallelism.rs`, which is `parallelism`-gated.
libc = { version = "0.2", optional = true }
wide = "1.6.1"

# Latest released tokenizers, used as the comparison baseline by the CI benchmark
# (examples gated on `bench-baseline`). Optional so production builds never pull it.
tokenizers-release = { package = "tokenizers", version = "=0.23.1", optional = true }

[features]
# `fancy-regex` is the OPTIONAL system-regex backend, needed ONLY for a *regex* pattern in a `Split`
# pre-tokenizer or a `Replace` normalizer — the atomsplit-native pre-tokenizers (GPT-2, cl100k,
# deepseek, the class family, char-delimiter) need no backend, and a plain string pattern is searched
# for directly. Without it a stub compiles and those regex paths error at load. Enable with
# `--features fancy-regex`.
# Only BPE: none of the current SOTA models use anything else, and the umbrella crate turns the
# rest back on, so python and existing `tokenizers::…` users are unaffected.
default = ["bpe"]
# ponytail: BPE itself is still compiled unconditionally -- the marker exists so `default` states
# the intent and so a BPE-less build later is a feature change rather than an API one. Gating it for
# real means threading a cfg through `PipelineBPE`, the byte-level fold and the merge queues, which
# buys nothing today (the ask is BPE-*only*, not BPE-optional).
bpe = []
unigram = []
wordpiece = ["dep:yada"]
wordlevel = []
# The table-backed normalizers: NFC/NFD/NFKC/NFKD, Nmt, StripAccents, Bert, and SentencePiece's
# precompiled charsmap. Between them they are ~150 KB of static Unicode tables, kept alive by enum
# arms most tokenizers never construct — so they are a `cfg` on the variants, not just unused code.
# A tokenizer naming one of these in a build without the feature fails at load, which is correct.
normalizers = [
  "dep:unicode-normalization",
  "dep:unicode-normalization-alignments",
  "dep:spm_precompiled",
  "dep:unicode-segmentation",
]
# The `UnicodeScripts` pre-tokenizer. Same shape of cost as `normalizers`, and the same reason to be
# a feature: `get_script` is ~19 KB of generated range-match code and the `BMP_SCRIPT` lookup table
# it feeds is a `LazyLock<[Script; 0x10000]>`, i.e. another 64 KiB of `__DATA`, all kept alive by an
# enum arm. Measured on `binsize_pipeline` under `--profile minsize`: turning it off is -84,468
# stripped (-11.5%) and -11,559 gzipped (-3.3%). Nothing else in the crate reaches it, and no
# `tokenizer.json` in `data/` names it -- it is a SentencePiece-era pre-tokenizer, and `unigram` is
# already off by default too. A tokenizer naming it in a build without the feature fails at load,
# which is correct.
unicode-scripts = []
# NOTE: there is deliberately no `config` feature any more, and no serde in this crate at all.
# Every component's on-disk shape is a *mirror* in `tk-convert`: a local struct of the JSON shape
# that converts, because the orphan rule stops a foreign crate implementing `Deserialize` for a type
# declared here. That leaves the runtime with no serde, no serde_json, no monostate, and no `regex`
# (`regex` stays a dev-dependency only -- the `Pattern for &Regex` impl is `#[cfg(test)]`).
progressbar = ["indicatif"]
http = ["hf-hub"]
unstable_wasm = ["fancy-regex", "dep:getrandom", "getrandom/wasm_js"]
rustls-tls = ["hf-hub?/rustls-tls"]
bench-baseline = ["dep:tokenizers-release", "fancy-regex"]
parallelism = ["dep:rayon", "dep:rayon-cond", "dep:libc"]

[dev-dependencies]
criterion = "0.6"
# Test-only: one `#[cfg(test)]` cross-check in `vocab/buckets.rs`.
daachorse = "3.0.0"
# The unit tests build `regex::Regex` values directly, in every feature rung, so the tests need
# it even when the library itself does not link it.
regex = "1.10"
tempfile = "3.10"
assert_approx_eq = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3.18"

# Everything that drove the tokenizer through serde -- the oracles that compare against the serde
# read path, the benches that load a `tokenizer.json` with it, and the comparative fixture bench --
# moved to `tk-convert` with the `Tokenizer` they are written against. What is left here needs
# no config layer at all.
