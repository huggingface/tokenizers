[package]
name = "fast_split"
version = "0.1.0"
edition = "2024"
authors = [
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Inference (encode/decode) half of the 🤗 Tokenizers library: model engines,
the full pipeline components, and the `Tokenizer` orchestration — without any
training code.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "fast_split"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
memchr = "2.8.2"
# NOTE: classify tables live in src/atom_tables.rs (committed, generated). Regenerate after any atom
# scheme change with `cargo run -p bitmap_gen`. No build script / build-dep — fast_split builds clean.
[dev-dependencies]
unicode-segmentation = "1.11"
unicode-normalization-alignments = "0.1"
regex-syntax = "0.8"
regex = "1.10"
onig = "6.5.1"
fancy-regex = "0.13"
[[bench]]
name = "cl100k"
harness = false

[[bench]]
name = "deepseek"
harness = false

[[bench]]
name = "wssplit"
harness = false

[[bench]]
name = "byte_level"
harness = false

[[bench]]
name = "threads"
harness = false

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "fused"
harness = false
