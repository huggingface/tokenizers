[package]
name = "tk-train"
version = "0.1.0-dev.0"
edition = "2024"
authors = [
  "Arthur Zucker <arthur@huggingface.co>",
  "Luc Georges <luc@huggingface.co>",
  "Simon Brandeis <simon@huggingface.co>",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Training half of the 🤗 Tokenizers library: the `Trainer` trait, every
`*Trainer`, and the training extension over `tk-encode`'s `Tokenizer`.
"""

[lib]
name = "tk_train"
path = "src/lib.rs"

[dependencies]
tk-encode = { path = "../tk-encode", version = "0.1.0-dev.0", default-features = false, features = [
  "parallelism",
] }
# `ModelWrapper`, `TokenizerImpl` and `AddedToken` live in the config layer.
tk-convert = { path = "../tk-convert", version = "0.1.0-dev.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8.11", features = ["serde"] }
compact_str = { version = "0.9", features = ["serde"] }
dary_heap = { version = "0.3.6", features = ["serde"] }
log = "0.4"
itertools = "0.14"
thiserror = "2"
esaxx-rs = { version = "0.1.10", default-features = false, optional = true }
indicatif = { version = "0.18", optional = true }

[features]
default = ["progressbar", "bpe", "unigram", "wordpiece", "wordlevel"]
bpe = ["tk-encode/bpe"]
unigram = ["tk-encode/unigram", "dep:esaxx-rs"]
# The WordPiece trainer runs the BPE one and keeps only its vocabulary.
wordpiece = ["bpe", "tk-encode/wordpiece"]
wordlevel = ["tk-encode/wordlevel"]
esaxx_fast = ["unigram", "esaxx-rs/cpp"]
progressbar = ["dep:indicatif"]
parity-aware-bpe = ["bpe"]

[dev-dependencies]
tempfile = "3.10"
assert_approx_eq = "1.1"
