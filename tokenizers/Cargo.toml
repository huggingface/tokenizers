[workspace]
resolver = "3"
members = ["bitmap_gen", "atomsplit", "tk-encode", "tk-serialize", "tk-convert"]
# `tk-train` builds *config* models: it imports `TokenizerImpl`, `ModelWrapper`, `AddedToken` and the
# config-shaped `BPE` from `tk-convert` across 8 files, none of which exist in rc0. Excluded rather
# than deleted -- the trainers are v1 work (`REQUIRED_FOR_V1.md` §2) and this code is where they
# start -- and excluded rather than left in `members`, because a member that does not build turns
# `cargo build --workspace` red, which is the one gate rc0 keeps green.
exclude = ["tk-train"]

[package]
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
edition = "2024"
name = "tokenizers"
version = "0.23.2-dev.0"
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
readme = "./README.md"
description = """
Provides an implementation of today's most used tokenizers,
with a focus on performances and versatility. Umbrella crate re-exporting
`tk-encode` (inference).
"""
# Every test and bench in this crate drives the *authoring* surface -- `Tokenizer::new`,
# `with_pre_tokenizer`, `add_tokens`, `save`, the trainers -- which rc0 does not have:
# `PipelineTokenizer` is read-only and has 0 setters (`REQUIRED_FOR_V1.md` §1). So all 9 benches and
# all 8 test files are out of the build rather than deleted; they are the specification for the
# builder v1 has to grow, and they come back with it.
#
# Autodiscovery has to be turned off explicitly, not just left un-listed: cargo finds `tests/*.rs`
# and `benches/*.rs` on its own, so dropping the `[[bench]]` entries alone would not have stopped
# `cargo build --workspace --all-targets` from compiling them.
autotests = false
autobenches = false
exclude = [
  "rust-toolchain",
  "target/*",
  "Cargo.lock",
  "benches/*.txt",
  "benches/*.json",
  "data/*",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tokenizers"
path = "src/lib.rs"
bench = false

[dependencies]
# The umbrella is the "everything on" crate: existing `tokenizers::…` users and both bindings get
# the full surface, so `tk-encode`'s slim defaults never reach them.
tk-encode = { path = "tk-encode", version = "0.23.2-dev.0", default-features = false, features = [
  "parallelism",
  # The components' own serde. `tk-convert` asks for it as well; spelled out here too because this
  # crate's whole job is the full surface, and `PyEncoding`'s pickling reaches it directly.
  "serde",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  # `tokenizers::pre_tokenizers::unicode_scripts` predates the split and is public API.
  "unicode-scripts",
] }
# The legacy-config upgrade pass, all that is left of the config layer. It forwards no features any
# more -- it depends on neither `tk-encode` nor serde -- so it is named here for one reason: to keep
# `tokenizers::canonicalize_file` and friends reachable from the facade.
tk-convert = { path = "tk-convert", version = "0.23.2-dev.0", default-features = false }

[features]
# `train` and `esaxx_fast` are gone with `tk-train` (excluded from the workspace above), and
# `parity-aware-bpe` was a trainer knob. Everything left forwards to `tk-encode` alone.
default = ["progressbar", "onig"]
progressbar = ["tk-encode/progressbar"]
onig = ["tk-encode/fancy-regex"]
http = ["tk-encode/http"]
unstable_wasm = ["tk-encode/unstable_wasm"]
rustls-tls = ["tk-encode/rustls-tls"]


[dev-dependencies]
criterion = "0.6"
serde_json = "1.0"
ahash = "0.8.11"
tempfile = "3.10"
assert_approx_eq = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3.18"

[profile.release]
lto = "fat"

# What an on-device / edge build actually uses, and the profile the binary-size numbers are quoted
# under. Kept separate from `release` on purpose: `opt-level = "z"` would wreck the throughput
# benchmarks, which measure under `release`.
[profile.minsize]
inherits = "release"
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = "fat"
strip = true

# `slimest` is `minsize` plus a rebuilt `std`. It exists because the largest single cost in an
# encode-only binary is not our code: `std`'s panic, unwinding and backtrace-symbolisation machinery
# (`addr2line`, `gimli`, `rustc_demangle`, `object`, and the build machine's source paths baked into
# `__cstring`) is about 40% of the gzipped output. `panic = "abort"` alone does not remove it —
# libstd ships precompiled with those tables — so it takes `-Z build-std-features=panic_immediate_abort`
# and therefore nightly.
#
# Use it through `make slimest` / `make slimest-size`, which pass the required `-Z` flags; a bare
# `cargo build --profile slimest` on stable is just `minsize` with a different directory name.
#
# The trade is real and deliberate: every panic becomes an immediate `abort` with no message, no
# unwinding and no backtrace, so a panicking input is indistinguishable from any other crash. That is
# usually fine on-device and rarely fine on a server.
[profile.slimest]
inherits = "minsize"

[profile.profiling]
inherits = "release"
debug = true
