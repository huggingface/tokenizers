[workspace]
resolver = "3"
members = ["bitmap_gen", "bitcannon", "tk-encode", "tk-serialize", "tk-convert", "tk-train"]

[package]
authors = [
  "Arthur Zucker <arthur@huggingface.co>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Luc Georges <luc@huggingface.co>",
  "Simon Brandeis <simon@huggingface.co>",
]
edition = "2024"
name = "tokenizers"
version = "1.0.0-dev.0"
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = [
  "tokenizer",
  "huggingface",
  "BPE",
  "WordPiece",
  "SIMD"
]
readme = "./README.md"
description = """
Fastest implementation of the most used tokenizers in AI. """
autotests = false
autobenches = false
exclude = ["rust-toolchain", "target/*", "Cargo.lock", "data/*"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tokenizers"
path = "src/lib.rs"
bench = false

[dependencies]
tk-encode = { path = "tk-encode", version = "0.1.0-dev.0", default-features = false }
tk-convert = { path = "tk-convert", version = "0.1.0-dev.0", default-features = false }
tk-serialize = { path = "tk-serialize", version = "0.1.0-dev.0", default-features = false, features = [
  "deserialize",
] }
tk-train = { path = "tk-train", version = "0.1.0-dev.0", default-features = false, optional = true }

# Everything is on by default; a binding that wants a smaller build turns defaults off and picks.
# The component features go through `tk-serialize`, which forwards each one to `tk-encode`: the
# reader has one match arm per component, so the two crates must never disagree on the set.
[features]
default = [
  "progressbar",
  "parallelism",
  "serialize",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
]
bpe = ["tk-serialize/bpe", "tk-train?/bpe"]
unigram = ["tk-serialize/unigram", "tk-train?/unigram"]
wordpiece = ["tk-serialize/wordpiece", "tk-train?/wordpiece"]
wordlevel = ["tk-serialize/wordlevel", "tk-train?/wordlevel"]
normalizers = ["tk-serialize/normalizers"]
unicode-scripts = ["tk-serialize/unicode-scripts"]
parallelism = ["tk-serialize/parallelism"]
serialize = ["tk-serialize/serialize"]
progressbar = ["tk-train?/progressbar"]
train = ["dep:tk-train"]
# The C++ suffix array for Unigram training. Without it, `UnigramTrainer` uses esaxx-rs's pure-Rust one.
esaxx_fast = ["train", "unigram", "tk-train/esaxx_fast"]
parity-aware-bpe = ["train", "bpe", "tk-train/parity-aware-bpe"]
regex = ["tk-serialize/fancy-regex"]
http = ["tk-encode/http"]

[dev-dependencies]
criterion = "0.8"
serde_json = "1.0"
ahash = "0.8.12"
tempfile = "3.27"
assert_approx_eq = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "fat"

# This is for a slim, on edge build. Perfs are bound to be worst than the normal release, but it reduces the crate size.
[profile.minsize]
inherits = "release"
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = "fat"
strip = true

# `slimest` is `minsize` plus a rebuilt `std` (about 40% of the gzipped output)
# Needs `-Z build-std-features=panic_immediate_abort` and therefore nightly version of rust.
#
# Used in `make slimest` / `make slimest-size`, which pass the required `-Z` flags; a bare
# `cargo build --profile slimest` on stable is just `minsize` with a different directory name.
#
[profile.slimest]
inherits = "minsize"

[profile.profiling]
inherits = "release"
debug = true
