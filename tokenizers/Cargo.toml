[workspace]
resolver = "3"
members = ["bitmap_gen", "bitsplit", "tk-encode", "tk-serialize", "tk-convert"]
exclude = ["tk-train"]

[package]
authors = [
  "Arthur Zucker <arthur@huggingface.co",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Luc Georges <luc@huggingface.co",
  "Simon Brandeis <simon@huggingface.co",
]
edition = "2024"
name = "tokenizers"
version = "1.0.0-rc.0"
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = [
  "tokenizer",
  "NLP",
  "huggingface",
  "BPE",
  "WordPiece",
  "SIMD",
  "bitstream",
  "regex",
]
readme = "./README.md"
description = """
Fastest implementation of the most used tokenizers in AI. """
autotests = false
autobenches = false
exclude = [
  "rust-toolchain",
  "target/*",
  "Cargo.lock",
  "data/*",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tokenizers"
path = "src/lib.rs"
bench = false

[dependencies]
tk-encode = { path = "tk-encode", version = "1.0.0-rc.0", default-features = false, features = [
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
] }
tk-convert = { path = "tk-convert", version = "1.0.0-rc.0", default-features = false }
# The reader and the writer. Same component features as `tk-encode` above: the reader has one match
# arm per component, so a component compiled out of the runtime cannot be read into it either.
tk-serialize = { path = "tk-serialize", version = "1.0.0-rc.0", default-features = false, features = [
  "deserialize",
  "serialize",
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
] }

[features]
default = ["progressbar"]
progressbar = ["tk-encode/progressbar"]
regex = ["tk-encode/fancy-regex"]
http = ["tk-encode/http"]
unstable_wasm = ["tk-encode/unstable_wasm"]


[dev-dependencies]
criterion = "0.8"
serde_json = "1.0"
ahash = "0.8.12"
tempfile = "3.27"
assert_approx_eq = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "fat"

# This is for a slim, on edge build. Perfs are bound to be worst than the normal release, but it reduces the crate size.
[profile.minsize]
inherits = "release"
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = "fat"
strip = true

# `slimest` is `minsize` plus a rebuilt `std` (about 40% of the gzipped output)
# Needs `-Z build-std-features=panic_immediate_abort` and therefore nightly version of rust.
#
# Used in `make slimest` / `make slimest-size`, which pass the required `-Z` flags; a bare
# `cargo build --profile slimest` on stable is just `minsize` with a different directory name.
#
[profile.slimest]
inherits = "minsize"

[profile.profiling]
inherits = "release"
debug = true
