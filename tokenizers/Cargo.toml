[workspace]
resolver = "3"
members = ["bitmap_gen", "atomsplit", "tk-encode", "tk-serialize", "tk-convert", "tk-train"]

[package]
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
edition = "2024"
name = "tokenizers"
version = "0.23.2-dev.0"
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
readme = "./README.md"
description = """
Provides an implementation of today's most used tokenizers,
with a focus on performances and versatility. Umbrella crate re-exporting
`tk-encode` (inference) and `tk-train` (training).
"""
exclude = [
  "rust-toolchain",
  "target/*",
  "Cargo.lock",
  "benches/*.txt",
  "benches/*.json",
  "data/*",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tokenizers"
path = "src/lib.rs"
bench = false

[[bench]]
name = "bpe_benchmark"
harness = false

[[bench]]
name = "bert_benchmark"
harness = false

[[bench]]
name = "layout_benchmark"
harness = false

[[bench]]
name = "unigram_benchmark"
harness = false

[[bench]]
name = "llama3_benchmark"
harness = false

[[bench]]
name = "added_vocab_deserialize"
required-features = ["http"]
harness = false

[[bench]]
name = "truncation_benchmark"
harness = false

[[bench]]
name = "decode_benchmark"
harness = false

[[bench]]
name = "ci_benchmark"
harness = false

[dependencies]
# The umbrella is the "everything on" crate: existing `tokenizers::…` users and both bindings get
# the full surface, so `tk-encode`'s slim defaults never reach them.
tk-encode = { path = "tk-encode", version = "0.23.2-dev.0", default-features = false, features = [
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  # `tokenizers::pre_tokenizers::unicode_scripts` predates the split and is public API. The deleted
  # `config` feature used to imply it.
  "unicode-scripts",
] }
# The config/BC layer. Non-optional: `tokenizers::Tokenizer` and the five wrapper enums live here,
# and both bindings need them.
tk-convert = { path = "tk-convert", version = "0.23.2-dev.0", default-features = false, features = [
  "parallelism",
] }
tk-train = { path = "tk-train", version = "0.23.2-dev.0", default-features = false, optional = true }

[features]
default = ["progressbar", "onig", "esaxx_fast", "train"]
train = ["dep:tk-train"]
esaxx_fast = ["tk-train?/esaxx_fast"]
progressbar = ["tk-encode/progressbar", "tk-convert/progressbar", "tk-train?/progressbar"]
onig = ["tk-encode/fancy-regex", "tk-convert/fancy-regex"]
http = ["tk-encode/http", "tk-convert/http"]
unstable_wasm = ["tk-encode/unstable_wasm", "tk-convert/unstable_wasm"]
rustls-tls = ["tk-encode/rustls-tls", "tk-convert/rustls-tls"]
parity-aware-bpe = ["train", "tk-train/parity-aware-bpe"]


[dev-dependencies]
criterion = "0.6"
serde_json = "1.0"
ahash = "0.8.11"
tempfile = "3.10"
assert_approx_eq = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3.18"

[profile.release]
lto = "fat"

# What an on-device / edge build actually uses, and the profile the binary-size numbers are quoted
# under. Kept separate from `release` on purpose: `opt-level = "z"` would wreck the throughput
# benchmarks, which measure under `release`.
[profile.minsize]
inherits = "release"
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = "fat"
strip = true

# `slimest` is `minsize` plus a rebuilt `std`. It exists because the largest single cost in an
# encode-only binary is not our code: `std`'s panic, unwinding and backtrace-symbolisation machinery
# (`addr2line`, `gimli`, `rustc_demangle`, `object`, and the build machine's source paths baked into
# `__cstring`) is about 40% of the gzipped output. `panic = "abort"` alone does not remove it —
# libstd ships precompiled with those tables — so it takes `-Z build-std-features=panic_immediate_abort`
# and therefore nightly.
#
# Use it through `make slimest` / `make slimest-size`, which pass the required `-Z` flags; a bare
# `cargo build --profile slimest` on stable is just `minsize` with a different directory name.
#
# The trade is real and deliberate: every panic becomes an immediate `abort` with no message, no
# unwinding and no backtrace, so a panicking input is indistinguishable from any other crash. That is
# usually fine on-device and rarely fine on a server.
[profile.slimest]
inherits = "minsize"

[profile.profiling]
inherits = "release"
debug = true
