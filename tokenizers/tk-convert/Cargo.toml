[package]
name = "tk-convert"
version = "1.0.0-rc.0"
edition = "2024"
authors = [
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
  "Simon Brandeis <simon@huggingface.co",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
The legacy `tokenizer.json` upgrade pass of the 🤗 Tokenizers library: a JSON→JSON
rewrite that turns a config written by any older version into the canonical form
`tk-serialize`'s reader accepts.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tk_convert"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
thiserror = "2"
# The GPT-2 pattern a `ByteLevel` lowers to. `bitsplit::regexes` is the single source of truth for
# it -- tk-encode's runtime recognizer reads the same const -- so a copy here could drift and cost
# the FSM fast path without changing any test.
bitsplit = { path = "../bitsplit" }

# Latest released tokenizers, used as the comparison baseline by the fixture bench and as the
# independent id/decode oracle by `tests/pipeline_oracle.rs` and `tests/pipeline_decode_oracle.rs`.
tokenizers-release = { package = "tokenizers", version = "=0.23.1", optional = true }

[features]
default = []
bench-baseline = ["dep:tokenizers-release"]

[dev-dependencies]
tk-serialize = { path = "../tk-serialize", features = [
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "normalizers",
  "unicode-scripts",
  "fancy-regex",
  # The moved round-trip gate writes a config back out.
  "serialize",
] }
tk-encode = { path = "../tk-encode", default-features = false, features = [
  "fancy-regex",
] }
# The oracles fetch their tokenizer.json from the Hub instead of relying on `make models`, so each
# one is self-contained. `hf-hub` caches under ~/.cache/huggingface, so only the first run is online.
hf-hub = { version = "0.4.1", features = ["ureq"], default-features = false }
criterion = "0.8"
rayon = "1.12"
