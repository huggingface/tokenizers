[package]
name = "tk-convert"
version = "0.23.2-dev.0"
edition = "2024"
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
The `tokenizer.json` config layer of the 🤗 Tokenizers library: the component
wrapper enums and their serde impls, the `Tokenizer` orchestration, every
backwards-compatible config shape, and the lowering from a config into
`tk-encode`'s runtime pipeline.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tk_convert"
path = "src/lib.rs"

[dependencies]
# The whole point of this crate is to be the serde half, so `tk-encode` is pulled with everything
# the wrapper enums can hold: a wrapper's `Deserialize` names every variant, so every model and
# normalizer has to exist. There is no `config` feature to ask for any more -- `tk-encode` links no
# serde at all, and every component's on-disk shape is a mirror in this crate instead.
tk-encode = { path = "../tk-encode", default-features = false, features = [
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "normalizers",
  # `PreTokenizerWrapper` has a `UnicodeScripts` variant and `lowering` has a match arm for it, so
  # the pre-tokenizer has to exist. The deleted `config` feature used to imply this; spelling it out
  # is what that implication becomes. Workspace-wide feature unification hid its absence -- a
  # dev-dependency asks for it -- and only building `bindings/python` on its own caught it.
  "unicode-scripts",
] }
ahash = { version = "0.8.11", features = ["serde"] }
# The legacy `AddedVocabulary`'s matcher and its single-word regex guard.
daachorse = "3.0.0"
# The config-shaped `BPE`'s own merge loop: `Word::merge_all` runs a 4-ary heap of pending merges,
# and `rand` is what its dropout draws from. Both came over with the model.
dary_heap = "0.3.6"
rand = "0.9"
regex = "1.10"
log = "0.4"
paste = "1.0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

# Latest released tokenizers, used as the comparison baseline by the fixture bench.
tokenizers-release = { package = "tokenizers", version = "=0.23.1", optional = true }

[features]
default = []
parallelism = ["tk-encode/parallelism"]
progressbar = ["tk-encode/progressbar"]
fancy-regex = ["tk-encode/fancy-regex"]
http = ["tk-encode/http"]
rustls-tls = ["tk-encode/rustls-tls"]
unstable_wasm = ["tk-encode/unstable_wasm"]
bench-baseline = ["dep:tokenizers-release", "fancy-regex"]

[dev-dependencies]
# The oracle and `slim_vs_config` build the pipeline BOTH ways from the same file and demand
# identical output, so they need the canonical reader as well as this crate's serde one.
#
# Every component feature is spelled out: the reader has one `cfg` arm per component, and a
# component compiled out is a config it *refuses*. With the default set the oracle silently drops
# to 240 of 300 comparisons (t5-base and albert need `normalizers` + `unigram`), which is a
# comparison not made rather than a test that fails -- so this list is load-bearing.
tk-serialize = { path = "../tk-serialize", features = [
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "normalizers",
  "unicode-scripts",
] }
criterion = "0.6"
# The `from_pretrained` smoke test in `tokenizer/serialization.rs` turns on a subscriber.
tracing = "0.1"
tracing-subscriber = "0.3.18"
rayon = "1.10"
tempfile = "3.10"

# The oracle that gates the slim reader against this crate's serde reader. It lives here because it
# needs both halves; its digest file sits next to it.


[[bench]]
name = "pipeline_benchmark"
harness = false

[[bench]]
name = "bpe_model_benchmark"
required-features = ["http"]
harness = false
