[package]
name = "atomsplit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = [
  "Arthur Zucker <arthur@huggingface.co>",
  "Luc Georges <luc@huggingface.co>",
  "Simon Brandeis <simon@huggingface.co>",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/atomsplit/"
license = "Apache-2.0"
keywords = ["tokenizer", "nlp", "pretokenizer", "simd", "unicode"]
categories = ["text-processing", "parsing"]
description = "SIMD Unicode atom classification + FSM pre-tokenization: one classify pass into byte-exact token spans (cl100k, GPT-2/ByteLevel, DeepSeek, Whitespace, Bert, ...)."
exclude = ["benches/data/"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "atomsplit"
path = "src/lib.rs"

[dependencies]
memchr = "2.8.2" # SIMD single-byte search; used only in CharDelimiterSplit (1.4–23× vs scalar).
# NOTE: classify tables live in src/atom_tables.rs (committed, generated). Regenerate after any atom
# scheme change with `cargo run -p bitmap_gen`. No build script / build-dep — atomsplit builds clean.
[dev-dependencies]
onig = "6.5.1"          # reference regex for the parity tests + benches
fancy-regex = "0.13"    # second regex engine in the throughput benches
[[bench]]
name = "cl100k"
harness = false

[[bench]]
name = "deepseek"
harness = false

[[bench]]
name = "byte_level"
harness = false

[[bench]]
name = "threads"
harness = false

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "class_runs"
harness = false
