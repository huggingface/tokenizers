[package]
name = "atomsplit"
version = "0.1.0"
edition = "2024"
authors = [
  "Arthur Zucker <arthur@huggingface.co",
  "Luc Georges <luc@huggingface.co",
]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Inference (encode/decode) half of the 🤗 Tokenizers library: model engines,
the full pipeline components, and the `Tokenizer` orchestration — without any
training code.
"""

[package.metadata.docs.rs]
all-features = true

[lib]
name = "atomsplit"
path = "src/lib.rs"

[dependencies]
memchr = "2.8.2"
# NOTE: classify tables live in src/atom_tables.rs (committed, generated). Regenerate after any atom
# scheme change with `cargo run -p bitmap_gen`. No build script / build-dep — atomsplit builds clean.
[dev-dependencies]
onig = "6.5.1"          # reference regex for the parity tests + benches
fancy-regex = "0.13"    # second regex engine in the throughput benches
[[bench]]
name = "cl100k"
harness = false

[[bench]]
name = "deepseek"
harness = false

[[bench]]
name = "byte_level"
harness = false

[[bench]]
name = "threads"
harness = false

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "class_runs"
harness = false
