[package]
name = "atomnorm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Arthur Zucker <arthur@huggingface.co>"]
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
license = "Apache-2.0"
keywords = ["unicode", "normalization", "nfc", "nfd", "simd"]
categories = ["text-processing"]
description = "Data-driven Unicode normalization (NFC/NFD/NFKC/NFKD): skip what needs no work at SIMD speed, table-write the rest. Zero runtime dependencies."

[dependencies]
# none — tables are committed (regenerate: cargo test -p atomnorm --release generate -- --ignored)

[features]
# Bench-only: compare against dzfrias/xxUTF (C + SIMD) in benches/normalize.rs. Off by default so the
# crate needs no C toolchain or network; `dep:cc` + build.rs activate only under this.
xxutf = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
unicode-normalization = "0.1.25" # table generator source + byte-exactness oracle (never linked at runtime)
# scan-table sources + oracles: the SAME crates the tk-encode legacy normalizers use, so the baked
# property sets are bug-compatible with them (never linked at runtime either)
unicode_categories = "0.1"
unicode-normalization-alignments = "0.1"

[[bench]]
name = "normalize"
harness = false
