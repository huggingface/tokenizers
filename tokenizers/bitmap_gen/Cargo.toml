[package]
name = "bitmap_gen"
version = "0.1.0"
edition = "2024"
description = "Dev tool: regenerates bitcannon's committed classify tables (uses onig). Not for publication."
license = "Apache-2.0"
repository = "https://github.com/huggingface/tokenizers"
authors = ["Arthur Zucker <arthur@huggingface.co>", "Luc Georges <luc@huggingface.co>"]
publish = false

[dependencies]
# Oracle for backwards compatibility with tokenizers 0.23
onig = "6.5.1"
# Pins the unicode version used by onig
# Pinned to the version released `tokenizers` 0.23.x wheels lock (bindings/python/Cargo.lock).
onig_sys = { version = "=69.9.3", default-features = false }
