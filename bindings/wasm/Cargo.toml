[package]
name = "tokenizers-web"
version = "0.1.0-dev.2"
edition = "2024"
authors = ["Simon Brandeis <simon@huggingface.co>"]
description = "WebAssembly bindings to the Hugging Face tokenizers library, for fast tokenization in the browser."
homepage = "https://github.com/huggingface/tokenizers/tree/main/bindings/wasm"
repository = "https://github.com/huggingface/tokenizers"
license = "Apache-2.0"
keywords = ["tokenizer", "huggingface", "wasm", "browser", "BPE"]

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
# ---- Tokenizer core logic ----
tk-encode = { path = "../../tokenizers/tk-encode", default-features = false, features = [
	"normalizers",
	"bpe",
	"unigram",
	"wordpiece",
	"wordlevel",
	"unicode-scripts",
] }
tk-serialize = { path = "../../tokenizers/tk-serialize", features = [
	"normalizers",
	"bpe",
	"unigram",
	"wordpiece",
	"wordlevel",
	"unicode-scripts",
] }
tk-convert = { path = "../../tokenizers/tk-convert", default-features = false }

# ---- Bindings helpers ----
# Rust-wasm interop
wasm-bindgen = "=0.2.129"
# Helpers for async / promises
wasm-bindgen-futures = "0.4.79"
# Types for built-in Javascript objects
js-sys = "0.3"
# Bindings to browser APIs, required to implement Tokenizer::from_pretrained
web-sys = { version = "0.3.106", features = [
	"Headers",
	"RequestInit",
	"Response",
] }
# Write typescript interfaces from rust structs, JS <> Rust object conversion
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
# Required to parse Rust struct from  Typescript / JS objects
serde = { version = "1", features = ["derive"] }
# Required to deserialize user-provided Javascript functions (eg override `fetch` in Tokenizer::from_pretrained)
serde-wasm-bindgen = "0.6"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# getrandom gets pulled in the dependency tree and need the wasm_js feature to work in the browser
getrandom_03 = { package = "getrandom", version = "0.3", features = [
	"wasm_js",
] }
getrandom_04 = { package = "getrandom", version = "0.4", features = [
	"wasm_js",
] }

[dev-dependencies]
# Test runner
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
