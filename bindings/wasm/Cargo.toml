[package]
name = "tokenizers-wasm"
version = "0.1.0-dev.0"
edition = "2024"
authors = ["Simon Brandeis <simon@huggingface.co>"]

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
# Rust-wasm interop
wasm-bindgen = "=0.2.129"
# Helpers for async / promises
wasm-bindgen-futures = "0.4.79"
# Tokenization logic
tk-encode = { path = "../../tokenizers/tk-encode", default-features = false, features = [
	"normalizers",
	"bpe",
	"unigram",
	"wordpiece",
	"wordlevel",
	"unicode-scripts",
] }
# Parsing tokenizer config
tk-serialize = { path = "../../tokenizers/tk-serialize", features = [
	"normalizers",
	"bpe",
	"unigram",
	"wordpiece",
	"wordlevel",
	"unicode-scripts",
] }
# Parsing tokenizer config
tk-convert = { path = "../../tokenizers/tk-convert", default-features = false }
# JS interface <> Rust struct interop
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
# Required to parse Rust struct from  Typescript / JS objects
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
	"Headers",
	"RequestInit",
	"Response",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# getrandom gets pulled in the dependency tree and need the wasm_js feature to work in the browser
getrandom_03 = { package = "getrandom", version = "0.3", features = [
	"wasm_js",
] }
getrandom_04 = { package = "getrandom", version = "0.4", features = [
	"wasm_js",
] }

[dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
