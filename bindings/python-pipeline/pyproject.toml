[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tokenizers-pipeline"
description = "Experimental Python bindings for the tokenizers PipelineTokenizer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.16.4"]

[tool.maturin]
python-source = "py_src"
module-name = "tokenizers_pipeline._native"
bindings = "pyo3"
features = ["ext-module"]
