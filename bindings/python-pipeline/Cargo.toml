[package]
name = "tokenizers-pipeline-python"
version = "0.1.0"
edition = "2024"
description = "Experimental Python bindings for the tokenizers PipelineTokenizer"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29", features = ["abi3-py310", "experimental-inspect"] }
numpy = "0.29"
rayon = "1.10"
libc = "0.2"
serde = "1.0"
serde_json = "1.0"
tk-encode = { path = "../../tokenizers/tk-encode", features = ["fancy-regex"] }
tk-train = { path = "../../tokenizers/tk-train" }

[features]
default = []
ext-module = ["pyo3/extension-module"]
