[package]
name = "tokenizers-python"
version = "1.0.0-dev.2"
edition = "2024"
publish = false
authors = [
  "Arthur Zucker <arthur@huggingface.co>",
  "Luc Georges <luc@huggingface.co>",
  "Simon Brandeis <simon@huggingface.co>",
]
[lib]
name = "tokenizers"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29", default-features = false, features = [
  "macros",
  "extension-module",
  "abi3-py310",
  "experimental-inspect",
] }
#TODO: this will be a soft dependency later on IMO.
numpy = "=0.29"
serde = "1.0"
# `preserve_order` is required for `repr` and the pickle to keep the key order of the `tokenizer.json`
# unsloth relies on key order to fix tokenizers:
# https://github.com/unslothai/unsloth/blob/61b2ffe04a1041e507135328ee0e25019dfb629e/unsloth/tokenizer_utils.py#L554-L557
serde_json = { version = "1.0", features = ["preserve_order"] }
# Renamed to avoid conflict with this crate's own lib
tk = { package = "tokenizers", path = "../../tokenizers", default-features = false, features = [
  # needed for `__repr__`.
  "serialize",
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
  "regex",
] }

[build-dependencies]
pyo3-build-config = "=0.29"

# Not a workspace member, so this does not inherit tokenizers/Cargo.toml's profile.
[profile.release]
lto = "fat"
