[package]
name = "tokenizers-python"
version = "1.0.0-dev.2"
edition = "2024"
publish = false
authors = [
  "Arthur Zucker <arthur@huggingface.co>",
  "Luc Georges <luc@huggingface.co>",
  "Simon Brandeis <simon@huggingface.co>",
]
[lib]
name = "tokenizers"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30", default-features = false, features = [
  "macros",
  "extension-module",
  "abi3-py310",
  "experimental-inspect",
] }
#TODO: this will be a soft dependency later on IMO.
numpy = "=0.30"
# Needed for the `Precompiled` normalizer
base64 = "0.22"
serde = "1.0"
serde_json = "1.0"
# Renamed: this crate's own lib is `tokenizers` too.
tk = { package = "tokenizers", path = "../../tokenizers", default-features = false, features = [
  # `to_json`, for `__repr__` and pickling.
  "serialize",
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
  "regex",
] }
pastey = "0.2.3"

[build-dependencies]
pyo3-build-config = "=0.30"

# Not a workspace member, so this does not inherit tokenizers/Cargo.toml's profile.
[profile.release]
lto = "fat"
