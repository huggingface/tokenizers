[package]
name = "tokenizers-python"
version = "0.24.0"
edition = "2024"
publish = false

[lib]
name = "tokenizers"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29", default-features = false, features = [
  "macros",
  "extension-module",
  "abi3-py310",
  "experimental-inspect",
] }
numpy = "=0.29"
# Same three crates as `bindings/node`, for the same reason (see its Cargo.toml): only what the
# pipeline encode path needs, not the pre-v1 engine's umbrella.
tk-encode    = { path = "../../tokenizers/tk-encode", default-features = false, features = [
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
] }
tk-serialize = { path = "../../tokenizers/tk-serialize", features = [
  # `serialize` for `to_json`, which `Tokenizer.__repr__` renders.
  "serialize",
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
] }
tk-convert   = { path = "../../tokenizers/tk-convert", default-features = false }
# `Tokenizer.__repr__` renders the `tokenizer.json` the pipeline writes.
serde_json = "1.0"

[build-dependencies]
pyo3-build-config = "=0.29"

# Not a workspace member, so this does not inherit tokenizers/Cargo.toml's profile.
[profile.release]
lto = "fat"
