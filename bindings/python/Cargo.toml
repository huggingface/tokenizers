[package]
name = "tokenizers-python"
version = "1.0.0-dev.0"
edition = "2024"
description = "Fast Python bindings for 🤗 tokenizers, built on the PipelineTokenizer encode path"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29", features = ["experimental-inspect"] }
numpy = "0.29"
rayon = "1.10"
serde = "1.0"
serde_json = "1.0"
tk-encode = { path = "../../tokenizers/tk-encode", features = ["fancy-regex"] }
tk-train = { path = "../../tokenizers/tk-train", features = ["parity-aware-bpe"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# abi3 is on by default: one wheel per platform covers CPython 3.10–3.14.
# Free-threaded interpreters (3.14t) cannot load limited-API extensions, so
# their wheels build with `--no-default-features` (interpreter-specific tag).
[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py310"]
ext-module = ["pyo3/extension-module"]
