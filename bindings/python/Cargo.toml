[package]
name = "tokenizers-python"
version = "1.0.0-dev.0"
edition = "2024"
description = "Fast Python bindings for 🤗 tokenizers, built on the PipelineTokenizer encode path"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29", features = ["abi3-py310", "experimental-inspect"] }
numpy = "0.29"
rayon = "1.10"
serde = "1.0"
serde_json = "1.0"
tk-encode = { path = "../../tokenizers/tk-encode", features = ["fancy-regex"] }
tk-train = { path = "../../tokenizers/tk-train" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
ext-module = ["pyo3/extension-module"]
