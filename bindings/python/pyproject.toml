[project]
name = "tokenizers"
dynamic = ["version"]
requires-python = ">=3.10"
readme = "README.md"
description = "Reworked tokenizers Python bindings, over the pipeline encode path (not for release yet)"
dependencies = ["huggingface_hub>=0.16.4,<2.0", "numpy"]

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "tokenizers.tokenizers"
bindings = "pyo3"

[tool.pytest.ini_options]
markers = ["network: talks to the Hugging Face Hub"]

[tool.ruff]
line-length = 119
# `tokenizers` and the tests' `conftest` are first-party for import sorting.
src = ["python", "tests"]
lint.select = ["E4", "E7", "E9", "F", "I"]
