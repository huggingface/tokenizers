[project]
name = "tokenizers"
requires-python = ">=3.10"
authors = [
  { name = "Nicolas Patry", email = "patry.nicolas@protonmail.com" },
  { name = "Anthony Moi", email = "anthony@huggingface.co" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["NLP", "tokenizer", "BPE", "transformer", "deep learning"]
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["description", "readme", "version"]
dependencies = ["huggingface_hub>=0.16.4,<2.0"]

[project.urls]
Homepage = "https://github.com/huggingface/tokenizers"
Source = "https://github.com/huggingface/tokenizers"


[project.optional-dependencies]
testing = ["pytest", "pytest-asyncio", "requests", "numpy", "datasets", "ruff", "ty"]
docs = ["sphinx", "sphinx_rtd_theme", "setuptools_rust"]
dev = ["tokenizers[testing]"]


[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "py_src"
module-name = "tokenizers.tokenizers"
bindings = "pyo3"
features = ["pyo3/extension-module", "abi3"]


[tool.ruff]
line-length = 119
target-version = "py311"
# This is ruff's historical default rule set, which we relied on implicitly
# until ruff started shipping a much larger one by default (0.14 enabled 53
# rules here, 0.16 enables 411). CI installs ruff unpinned, so leaving the
# selection implicit means a ruff release can turn hundreds of new rules on
# and redden main without a line of our code changing. Opt in explicitly.
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = [
  # a == None in tests vs is None.
  "E711",
  # a == False in tests vs is False.
  "E712",
  # try.. import except.. pattern without using the lib.
  "F401",
  # Raw type equality is required in asserts
  "E721",
  # Import order
  "E402",
  # Fixtures unused import
  "F811",
]

[tool.ty.rules]
invalid-method-override = "ignore"
invalid-type-form = "ignore"
