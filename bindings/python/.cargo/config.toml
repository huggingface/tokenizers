# macOS: leave CPython symbols unresolved at link time — they come from the
# Python process that loads the extension. maturin passes these flags itself;
# this file covers plain `cargo build` / `cargo clippy`.
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]
