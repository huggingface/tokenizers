[package]
authors = ["Nicolas Patry <nicolas@huggingface.co>"]
edition = "2024"
name    = "node"
version = "1.0.0-dev.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = "3"
napi-derive = "3"
# No `serialize`: nothing here writes a config back out.
tokenizers = { path = "../../tokenizers", default-features = false, features = [
  "parallelism",
  "normalizers",
  "bpe",
  "unigram",
  "wordpiece",
  "wordlevel",
  "unicode-scripts",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
