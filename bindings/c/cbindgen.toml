language = "C"
cpp_compat = true
header = "// Generated by cbindgen. DO NOT EDIT."
include_guard = "TOKENIZERS_C_H"
autogen_warning = "/* This file is generated by cbindgen from bindings/c/src/lib.rs. Do not edit by hand. */"
usize_is_size_t = true
style = "type"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[export]
prefix = "Tk"
