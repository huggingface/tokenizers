[project]
name = "tokenizers"
# Read from Cargo.toml's `[package] version` by maturin.
dynamic = ["version"]
requires-python = ">=3.10"
description = "Reworked tokenizers Python bindings, over the pipeline encode path (not for release yet)"
dependencies = ["numpy"]

[dependency-groups]
dev = [
    "ipython>=8.39.0",
    "maturin>=1.0,<2.0",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "tokenizers.tokenizers"
bindings = "pyo3"

[tool.ruff]
line-length = 119
lint.select = ["E4", "E7", "E9", "F"]
