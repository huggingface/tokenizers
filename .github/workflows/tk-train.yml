# tk-train is excluded from the tokenizers workspace, so none of rust.yml's
# `--workspace` commands reach it.
name: tk-train

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  build_and_test:
    permissions:
      contents: read
    name: Build & test
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: tokenizers/tk-train
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: tokenizers/tk-train
          cache-bin: false

      - name: Build
        run: cargo build --all-targets --all-features

      # `parity-aware-bpe` gates its own trainer and tests, so the default
      # build is a different crate and gets its own run.
      - name: Test (default features)
        run: cargo test

      - name: Test (all features)
        run: cargo test --all-features

  clippy:
    permissions:
      contents: read
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenizers/tk-train
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: tokenizers/tk-train

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    permissions:
      contents: read
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenizers/tk-train
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check
