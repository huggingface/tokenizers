name: Build PR Documentation

on:
  pull_request:
    # The bindings do not build against the v1 integration branch yet: `PipelineTokenizer` is
    # read-only and the trainers left the umbrella crate, so a PR into `feat/train_encode_split`
    # fails here for the reasons REQUIRED_FOR_V1.md §2 already tracks -- 195 references to wrapper
    # types that no longer exist. Drop this filter together with the mutable pipeline builder.
    branches-ignore:
      - feat/train_encode_split

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_pr_documentation.yml@cf20b09f274383f0d91a7055c5e43f0a2ab3d1a3  # main
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.number }}
      package: tokenizers
      path_to_docs: tokenizers/docs/source-doc-builder/
      package_path: tokenizers/bindings/python/
      version_tag_suffix: bindings/python/py_src/
      install_rust: true
