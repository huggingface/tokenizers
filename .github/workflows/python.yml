name: Python

on:
  push:
    branches:
      - main
    paths-ignore:
      - bindings/node/**
  pull_request:
    paths-ignore:
      - bindings/node/**

jobs:
  build_and_test:
    name: Build, run the examples, check the stubs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The default build is abi3-py310 (one binary covers 3.10–3.14):
        # test the floor and the newest. Free-threaded 3.14t can't load
        # abi3 extensions, so it builds without the default `abi3` feature.
        python: ["3.10", "3.14", "3.14t"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: python
          cache-bin: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build and install
        working-directory: ./bindings/python
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python maturin numpy pytest datasets mypy
          source .venv/bin/activate && maturin develop --release \
            ${{ matrix.python == '3.14t' && '--no-default-features' || '' }}

      # The examples read real tokenizer.json files + a text corpus. Cached
      # under a key of this workflow's own (not shared with pipeline-bench,
      # which needs the fixture corpora on top).
      - name: Cache test data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            tokenizers/data
            ~/.cache/huggingface
          key: python-test-data-${{ hashFiles('tokenizers/Makefile', 'tokenizers/tk-encode/examples/bench_models.json') }}

      - name: Download model tokenizers and corpus
        working-directory: tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make bench-models data/big.txt HF="uvx --from huggingface_hub hf"

      # Network-marked tests (Hub downloads) are skipped: they'd flake on
      # rate limits and from_file covers the same code paths.
      - name: Run the tests
        working-directory: ./bindings/python
        run: .venv/bin/python -m pytest -q -m "not network"

      # Every example runs here so they can never rot. 06 pulls wikitext-2
      # from the Hub (cached above). The threading example's scaling asserts
      # are disabled on macOS: those runners' noisy shared hosts make parallel
      # speedup unmeasurable (observed 0.4-0.5x on starved VMs). A held GIL
      # would be platform-independent, so the strict ubuntu jobs still catch it.
      - name: Run the examples
        working-directory: ./bindings/python
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOKENIZERS_SCALING_ASSERTS: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: |
          .venv/bin/python examples/01_pretrained.py
          .venv/bin/python examples/02_train_and_encode.py
          .venv/bin/python examples/03_threading.py
          .venv/bin/python examples/04_train_bert_wordpiece.py
          .venv/bin/python examples/05_train_bytelevel_bpe.py
          .venv/bin/python examples/06_train_with_datasets.py

      # The .pyi stubs are generated from the built extension; a difference
      # here means someone changed the Rust API without running `make stubs`.
      # `git status --porcelain` (not `git diff`) so brand-new, not-yet-tracked
      # stub files are caught too.
      - name: Check the committed stubs are current
        working-directory: ./bindings/python
        run: |
          cargo run --manifest-path tools/stub-gen/Cargo.toml
          if [ -n "$(git status --porcelain -- py_src)" ]; then
            git status --porcelain -- py_src
            git diff -- py_src
            echo "::error::committed .pyi stubs are stale — run 'make stubs' and commit the result"
            exit 1
          fi

      # Freshness (above) proves the stubs match the Rust API; stubtest
      # proves they match the *runtime* — every stubbed name exists with the
      # right shape, and nothing importable is missing from the stubs.
      - name: Check the stubs against the runtime (stubtest)
        working-directory: ./bindings/python
        run: .venv/bin/python -m mypy.stubtest tokenizers --allowlist stubtest_allowlist.txt

  build_windows:
    name: Build and test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: python
          cache-bin: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # No test data on Windows (the fetch targets need `make`): the
      # data-dependent tests skip themselves, the rest still exercise the
      # wheel end-to-end (train, encode, pickle, threading).
      - name: Build and test
        working-directory: ./bindings/python
        shell: bash
        run: |
          uv venv .venv --python 3.14
          source .venv/Scripts/activate
          uv pip install maturin numpy pytest
          maturin develop --release
          python -m pytest -q -m "not network"

  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: python

      - name: Lint with RustFmt
        run: cargo fmt --manifest-path ./bindings/python/Cargo.toml -- --check

      - name: Lint with Clippy
        run: cargo clippy --manifest-path ./bindings/python/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint the Python sources with ruff
        working-directory: ./bindings/python
        run: |
          uvx ruff check benches examples tests
          uvx ruff format --check benches examples tests

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Both ignores are unmaintained-crate advisories pulled in transitively
      # by the core crates (paste via rust-stemmers, fxhash via tk-encode).
      - name: Run Audit
        run: cargo audit -D warnings -f ./bindings/python/Cargo.lock --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0057
