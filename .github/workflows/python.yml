name: Python

on:
  push:
    branches:
      - main
    paths-ignore:
      - bindings/node/**
  pull_request:
    paths-ignore:
      - bindings/node/**

jobs:
  build_and_test:
    name: Build, run the examples, check the stubs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The cdylib is built with `abi3-py310`, so a single binary covers
        # 3.10–3.14; test the floor and the newest. Free-threaded 3.14t is
        # not supported (abi3 extensions cannot load there).
        python: ["3.10", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: python
          cache-bin: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build and install
        working-directory: ./bindings/python
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python maturin numpy pytest datasets
          source .venv/bin/activate && maturin develop --release

      # The examples read real tokenizer.json files + a text corpus. Cached
      # under a key of this workflow's own (not shared with pipeline-bench,
      # which needs the fixture corpora on top).
      - name: Cache test data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            tokenizers/data
            ~/.cache/huggingface
          key: python-test-data-${{ hashFiles('tokenizers/Makefile', 'tokenizers/tk-encode/examples/bench_models.json') }}

      - name: Download model tokenizers and corpus
        working-directory: tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make bench-models data/big.txt HF="uvx --from huggingface_hub hf"

      # Network-marked tests (Hub downloads) are skipped: they'd flake on
      # rate limits and from_file covers the same code paths.
      - name: Run the tests
        working-directory: ./bindings/python
        run: .venv/bin/python -m pytest -q -m "not network"

      # Every example runs here so they can never rot. 06 pulls wikitext-2
      # from the Hub (cached above).
      - name: Run the examples
        working-directory: ./bindings/python
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          .venv/bin/python examples/01_train_and_encode.py
          .venv/bin/python examples/02_pretrained.py
          .venv/bin/python examples/03_threading.py
          .venv/bin/python examples/04_train_bert_wordpiece.py
          .venv/bin/python examples/05_train_bytelevel_bpe.py
          .venv/bin/python examples/06_train_with_datasets.py

      # The .pyi stubs are generated from the built extension; a diff here
      # means someone changed the Rust API without running `make stubs`.
      - name: Check the committed stubs are current
        working-directory: ./bindings/python
        run: |
          cargo run --manifest-path tools/stub-gen/Cargo.toml
          git diff --exit-code -- py_src

  build_windows:
    name: Check it builds on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - name: Build
        run: cargo build --release --manifest-path ./bindings/python/Cargo.toml

  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: python

      - name: Lint with RustFmt
        run: cargo fmt --manifest-path ./bindings/python/Cargo.toml -- --check

      - name: Lint with Clippy
        run: cargo clippy --manifest-path ./bindings/python/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint the Python sources with ruff
        working-directory: ./bindings/python
        run: |
          uvx ruff check benches examples tests
          uvx ruff format --check benches examples tests

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Both ignores are unmaintained-crate advisories pulled in transitively
      # by the core crates (paste via rust-stemmers, fxhash via tk-encode).
      - name: Run Audit
        run: cargo audit -D warnings -f ./bindings/python/Cargo.lock --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0057
