name: Build documentation

# docs/source-doc-builder describes the 0.x Python API. The bindings were
# rewritten for 1.0 (PipelineTokenizer); until the docs are rewritten to
# match, the published docs only build on demand — automatic triggers would
# publish documentation for an API the package no longer has.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (defaults to the workflow commit)"
        required: false
        default: ""

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@e60a538eea9817ab312196d0d233604b01697265  # main
    with:
      commit_sha: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      package: tokenizers
      path_to_docs: tokenizers/docs/source-doc-builder/
      package_path: tokenizers/bindings/python/
      version_tag_suffix: bindings/python/py_src/
      install_rust: true
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
