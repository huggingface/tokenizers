name: Rust

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The inference and training halves get a job each, so a tk-train that does not
  # compile still leaves a readable tk-encode result instead of aborting it. Only
  # this direction is isolated: tk-train depends on tk-encode, so a broken
  # tk-encode fails both. The umbrella `tokenizers` crate re-exports tk-train, so
  # it is built and tested with the training half.
  build_and_test:
    name: Build & test ${{ matrix.half.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        half:
          # The rest of the workspace (atomsplit, bitmap_gen) is built and tested
          # with the inference half.
          - name: tk-encode
            packages: --workspace --exclude tokenizers --exclude tk-train
          - name: tk-train
            packages: --package tk-train --package tokenizers
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: tokenizers
          shared-key: rust-build
          # Skip caching ~/.cargo/bin — earlier runs left a stale
          # rustup-init binary masquerading as `cargo`, breaking the
          # build step on macOS. The cargo toolchain is reinstalled by
          # dtolnay/rust-toolchain each run anyway, so caching it adds
          # risk without speedup.
          cache-bin: false

      - name: Build
        run: cargo build ${{ matrix.half.packages }} --all-targets --verbose

      # Test fixtures are immutable — cache them so CI doesn't re-download
      # from the Hub (and get rate-limited) on every run.
      - name: Cache HF test data
        if: matrix.os != 'windows-latest'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: tokenizers/data
          key: hf-test-data-${{ hashFiles('tokenizers/Makefile') }}
          restore-keys: hf-test-data-

      # Provides `uvx`, used to run the huggingface_hub CLI that downloads
      # test fixtures (see the Makefile) without a separate install step.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make test HF="uvx --from huggingface_hub hf" TEST_PKGS="${{ matrix.half.packages }}"

      # Windows skips the integration tests and the full fixture set, but the
      # tk-encode lib tests load these two tokenizer files and fail without
      # them (on purpose: a missing fixture must not silently skip a test).
      # The runner has no GNU make, so this fetches them without the Makefile.
      # No tk-train test reads a fixture, so the training half skips this.
      - name: Download lib-test fixtures on Windows
        if: matrix.os == 'windows-latest' && matrix.half.name == 'tk-encode'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uvx --from huggingface_hub hf download hf-internal-testing/tokenizers-test-data gpt2.json albert-base-v1-tokenizer.json --repo-type dataset --local-dir data

      # Windows runs lib + doc tests only. bash so the step fails on the first
      # failing command. The default pwsh only propagates the last command's
      # exit code, which let a lib-test failure hide behind passing doc tests.
      - name: Run lib & doc tests on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo test ${{ matrix.half.packages }} --verbose --lib
          cargo test ${{ matrix.half.packages }} --verbose --doc

  # Matrixed so platform-specific cfg gates and target-specific lints get coverage.
  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: tokenizers
          shared-key: rust-build

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt

      - name: Lint with RustFmt
        run: cargo fmt --all -- --check

  readme:
    name: READMEs up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: tokenizers
          shared-key: cargo-readme

      - name: Install cargo-readme
        run: cargo install cargo-readme

      - name: Make sure every README matches its lib.rs
        shell: bash
        run: |
          for crate in . tk-encode tk-train; do
            echo "::group::cargo readme check for ${crate}"
            cargo readme --project-root "${crate}" > "${crate}/must_match_readme.md"
            diff "${crate}/must_match_readme.md" "${crate}/README.md"
            echo "::endgroup::"
          done

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: tokenizers
          shared-key: cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run Audit
        run: cargo audit -D warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0014 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2026-0204 --ignore RUSTSEC-2025-0057

  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: tokenizers
          shared-key: cargo-semver-checks

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks

      - name: Check semver
        run: cargo semver-checks --package tokenizers