name: Rust

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.12
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      # Necessary for now for the cargo cache: https://github.com/actions/cache/issues/133#issuecomment-599102035
      - if: matrix.os == 'ubuntu-latest'
        run: sudo chown -R $(whoami):$(id -ng) ~/.cargo/

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: tokenizers
          # Skip caching ~/.cargo/bin — earlier runs left a stale
          # rustup-init binary masquerading as `cargo`, breaking the
          # build step on macOS. The cargo toolchain is reinstalled by
          # dtolnay/rust-toolchain each run anyway, so caching it adds
          # risk without speedup.
          cache-bin: false

      - name: Install cargo-readme for Ubuntu
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c  # v2.87.10
        with:
          tool: cargo-readme

      - name: Install cargo-audit
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c  # v2.87.10
        with:
          tool: cargo-audit

      - name: Build
        run: cargo build --all-targets --verbose --manifest-path ./tokenizers/Cargo.toml

      # RustFmt is OS-invariant — gate to the canonical OS.
      # Clippy and Audit run on every matrix cell so platform-specific
      # cfg gates and target-specific lints get coverage.
      - name: Lint with RustFmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path ./tokenizers/Cargo.toml -- --check

      - name: Lint Benchmarks with RustFmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path ./tokenizers/Cargo.toml -- ./tokenizers/benches/bpe_benchmark.rs --check

      - name: Lint with Clippy
        run: cargo clippy --manifest-path ./tokenizers/Cargo.toml --all-targets --all-features -- -D warnings

      # Test fixtures are immutable — cache them so CI doesn't re-download
      # from the Hub (and get rate-limited) on every run.
      - name: Cache HF test data
        if: matrix.os != 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tokenizers/data
          key: hf-test-data-${{ hashFiles('tokenizers/Makefile') }}
          restore-keys: hf-test-data-

      # Provides `uvx`, used to run the huggingface_hub CLI that downloads
      # test fixtures (see the Makefile) without a separate install step.
      - name: Install uv
        if: matrix.os != 'windows-latest'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Run Tests
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: ./tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make test HF="uvx --from huggingface_hub hf"

      # Skip integration tests for now on Windows
      - name: Run lib Tests on Windows
        if: matrix.os == 'windows-latest'
        run: cargo test --verbose --manifest-path ./tokenizers/Cargo.toml --lib

      - name: Run doc Tests on Windows
        if: matrix.os == 'windows-latest'
        run: cargo test --verbose --manifest-path ./tokenizers/Cargo.toml --doc

      - name: Run Audit
        run: cargo audit -D warnings -f ./tokenizers/Cargo.lock --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0119

      # Verify that Readme.md is up to date.
      - name: Make sure, Readme generated from lib.rs matches actual Readme
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ./tokenizers
        run: cargo readme > must_match_readme.md && diff must_match_readme.md README.md

      - name: Check semver
        if: matrix.os == 'ubuntu-latest'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239  # v2
        with:
          manifest-path: ./tokenizers/Cargo.toml
