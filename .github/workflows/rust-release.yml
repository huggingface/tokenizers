name: Rust Release

env:
  CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

on:
  push:
    tags:
      - v*

jobs:
  rust_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo Registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cargo/registry
          key: ubuntu-latest-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

      # atomsplit ships committed classify tables (no build script). Regenerate them here — this
      # self-validates every codepoint against the reference atom() and fails the release if the
      # committed src/atom_tables.rs is stale (someone changed the scheme without `cargo run -p bitmap_gen`).
      - name: Regenerate & verify classify tables (bitmap_gen)
        working-directory: ./tokenizers
        run: |
          cargo run -p bitmap_gen
          git diff --exit-code atomsplit/src/atom_tables.rs \
            || { echo "::error::atomsplit/src/atom_tables.rs is stale — run 'cargo run -p bitmap_gen' and commit"; exit 1; }

      - name: Publish package rust
        working-directory: ./tokenizers
        if: ${{ !contains(github.ref, 'rc') }}
        run: cargo publish --token ${CRATES_TOKEN}

