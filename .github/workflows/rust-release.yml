name: Rust Release

env:
  CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  rust_publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo Registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ubuntu-latest-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

      # bitsplit ships committed classify tables (no build script). Regenerate them here — this
      # self-validates every codepoint against the reference atom() and fails the release if the
      # committed table is stale (someone changed the scheme without `cargo run -p bitmap_gen`).
      # The `--` matters: without it a path that no longer exists is read as a revision, and
      # `git diff` exits 128 on the argument, which this `||` would report as "is stale".
      - name: Regenerate & verify classify tables (bitmap_gen)
        working-directory: ./tokenizers
        run: |
          cargo run -p bitmap_gen
          git diff --exit-code -- bitsplit/src/classify/atom_tables.rs \
            || { echo "::error::bitsplit/src/classify/atom_tables.rs is stale — run 'cargo run -p bitmap_gen' and commit"; exit 1; }

      - name: Publish package rust
        working-directory: ./tokenizers
        if: ${{ !contains(github.ref, 'rc') }}
        run: cargo publish --token ${CRATES_TOKEN}

