name: Pipeline Benchmark

# Comparative benchmark: the experimental `PipelineTokenizer` vs the latest
# *released* tokenizers crate — both the baseline to beat AND the correctness
# reference (`ids_match`). The in-tree legacy `Tokenizer` is being
# phased out, so it only *builds* the pipeline and is never benched or trusted as
# an oracle. Runs for every model in tk-encode/examples/bench_models.json across
# every corpus in data/fixtures/.
# Measures single-thread throughput (whole corpus, cold instance per pass), an
# input-size sweep, a multi-thread sweep (2/4 threads) per fixture group,
# per-implementation memory footprint (RSS), stripped minimal-binary size, a
# decode phase over a release-minted id stream (`text_match` is its gate), and a
# deterministic work lane: exact allocation counts for both directions (a counting
# global allocator read by the memory children). The lane resolves regressions
# that wall time on shared runners cannot, and the report diffs it against the
# base branch with a "work vs base" verdict. The release dep is
# behind tk-encode's `bench-baseline` feature, so production builds never pull it.
#
# The released crate's numbers are CACHED, not re-measured every run: the release
# is pinned, so they only move when the machine does, yet timing its few-MB/s
# encodes used to dominate the run. The `plan` job hashes the bench inputs
# (fixture_bench.rs, the model manifest, the Makefile fixture lists) and looks for
# baselines/release-<runner group>-<hash>.json on the HF Hub dataset. Hit: the
# bench jobs run `--baseline-from` that file, skip all baseline timing, and
# re-measure one canary fixture per model so the report can flag a machine that
# drifted from the cache. Miss (any bench-input change): this run measures the
# baseline itself and the report job seeds the cache for the runs after it.
#
# A `build` job compiles the bench + binsize example binaries ONCE (each with its
# exact per-example feature set) and uploads them; the work is then fanned out,
# ONE JOB PER MODEL in the manifest: each downloads that binary and benches its
# model on its own isolated 8-vCPU runner (so the multi-thread sweep is accurate,
# the jobs run in parallel, and wall clock is the slowest model, not the slowest
# hand-packed shard), emitting a partial JSON; the single `report` job then
# concatenates the partials in manifest order and renders/uploads/updates once.
# Fixture corpora + model tokenizers are cached across jobs (keyed on the
# Makefile fixture lists + manifest).
#
# Triggers:
#   • push to feat/train_encode_split → benches and updates PR #2119's description.
#   • add the "run-pipeline-bench" label to any PR → benches that PR and updates
#     its description. Works before this workflow reaches the default branch,
#     because pull_request runs the workflow file from the PR's own branch. The
#     label is auto-removed on completion, so re-adding it re-runs. Same-repo
#     PRs only — fork PRs get no secrets and a read-only token.
#   • workflow_dispatch → manual run (usable only once this file is on the
#     default branch).
# Either way it maintains a marker-delimited benchmark section (graph + table)
# in the target PR's description; the workflow run itself is the PR check.
#
# vs base branch: besides the "vs latest release" charts, the report shows a
# "vs base branch" overview — this run's PipelineTokenizer against the base
# branch's, per fixture, so a PR's own wins/regressions are visible (regressions
# in red). The base's numbers are cached: a push to feat/train_encode_split
# uploads its merged JSON to the HF Hub dataset as baselines/pipeline-<sha>.json
# and force-moves the lightweight `pipeline-baseline` git tag to that commit
# ("add the tag if not there"). A PR run resolves that tag, downloads the cached
# JSON, and diffs against it ("otherwise read the data and plot the diff"). No
# tag yet (or no cached JSON) → the base overview is skipped, release charts stay.

on:
  push:
    branches: [feat/train_encode_split]
    paths:
      - "tokenizers/tk-encode/**"
      - "tokenizers/src/**"
      - "tokenizers/atomsplit/**"
      - "tokenizers/Cargo.lock"
      - ".github/workflows/pipeline-bench.yml"
      - ".github/scripts/render_pipeline_bench.py"
      - "tokenizers/tk-encode/examples/bench_models.json"
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose description gets the benchmark section (optional)"
        required: false
        type: string

permissions:
  contents: write       # force-move the `pipeline-baseline` tag on base-branch pushes
  actions: read         # download the base branch's bench artifact (baseline fallback)
  issues: write         # remove the trigger label
  pull-requests: write  # edit the PR description

# One live run per target. github.ref discriminates:
# refs/heads/feat/train_encode_split on push, refs/pull/<n>/merge on a labeled
# PR — so a newer commit or re-label supersedes an in-flight bench for the same
# PR, but different PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the model manifest into the bench matrix (one job per model) and
  # resolves the cached release-baseline numbers. The cache key hashes every
  # input that shapes the numbers — bench code, model manifest, fixture lists —
  # so any change to what is measured starts a fresh measuring run; the runner
  # group is in the file name (keep it in sync with `runs-on` below). On a hit
  # the JSON is re-published as a run artifact for the bench jobs.
  plan:
    name: plan (models + baseline cache)
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-pipeline-bench'
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.models }}
      baseline_path: ${{ steps.key.outputs.path }}
      have_baseline: ${{ steps.fetch.outputs.have }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Read the model matrix
        id: models
        run: |
          echo "models=$(jq -c '[.[].name]' tokenizers/tk-encode/examples/bench_models.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Compute the baseline cache key
        id: key
        run: |
          hash="${{ hashFiles('tokenizers/tk-encode/examples/fixture_bench.rs', 'tokenizers/tk-encode/examples/bench_models.json', 'tokenizers/Makefile') }}"
          echo "path=baselines/release-aws-general-8-plus-${hash}.json" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch cached baseline numbers
        id: fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if uvx --from huggingface_hub hf download hf-internal-testing/tokenizers-bench \
               "${{ steps.key.outputs.path }}" --repo-type dataset --local-dir cache_dir; then
            mv "cache_dir/${{ steps.key.outputs.path }}" baseline_cache.json
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Baseline cache hit: ${{ steps.key.outputs.path }}"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No cached baseline for this key — this run measures the release."
          fi

      - name: Publish the cache to this run's jobs
        if: steps.fetch.outputs.have == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: baseline-cache
          path: baseline_cache.json
          retention-days: 3

  # Compile the bench + binsize example binaries ONCE here, instead of every bench
  # job (and the report job) recompiling them. Uploaded as an artifact the other jobs
  # download and run — so a code change is compiled a single time per run, not 11-12×.
  build:
    name: build bench binaries
    # push / dispatch always run; a labeled PR runs only for our label.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-pipeline-bench'
    runs-on:
      group: aws-general-8-plus
    defaults:
      run:
        working-directory: tokenizers
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # `onig_sys` comes in through the released crate (the `bench-baseline` dep): the
      # release ships with Oniguruma as its default regex backend, and onig_sys generates
      # its bindings with bindgen, which needs libclang. The runner image doesn't ship it.
      - name: Install libclang (onig_sys → bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      # The per-example feature sets are load-bearing and MUST stay distinct — collapsing
      # them would corrupt what's measured:
      #   • fixture_bench + binsize_baseline WITH `bench-baseline` → link the released crate
      #     (fixture_bench = the throughput/memory bench; binsize_baseline = "cost of the
      #     released lib" size number).
      #   • binsize_pipeline WITHOUT it → the real shipping config whose size we report (no
      #     released crate linked in).
      # These are byte-for-byte the same cargo invocations the bench jobs / report ran before.
      - name: Build bench + binsize binaries
        run: |
          cargo build --release -p tk-encode --features tk-encode/bench-baseline \
            --example fixture_bench --example binsize_baseline
          cargo build --release -p tk-encode --example binsize_pipeline

      - name: Upload bench binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-binaries
          path: |
            tokenizers/target/release/examples/fixture_bench
            tokenizers/target/release/examples/binsize_baseline
            tokenizers/target/release/examples/binsize_pipeline
          retention-days: 3

  # Pipeline oracle tests: encode + decode parity of the pipeline against the
  # released crate. They live behind `bench-baseline` (they link the released
  # crate), so a plain `cargo test` skips them — this is where they run. Same
  # fixtures + models as the bench jobs. Both directions run; the WordPiece decode
  # tests fail on purpose (`PipelineWordPiece` keeps no id → token map) so the gap
  # stays visible instead of hiding behind a skipped test.
  oracle:
    name: pipeline oracle tests
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-pipeline-bench'
    runs-on:
      group: aws-general-8-plus
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # onig_sys (the released crate's regex backend, via bench-baseline) generates
      # bindings with bindgen → needs libclang.
      - name: Install libclang (onig_sys → bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache fixtures + model tokenizers
        uses: actions/cache@v4
        with:
          path: tokenizers/data
          key: bench-data-${{ hashFiles('tokenizers/Makefile', 'tokenizers/tk-encode/examples/bench_models.json') }}

      - name: Download fixtures and model tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make fixtures models HF="uvx --from huggingface_hub hf"

      - name: Run pipeline oracle tests (parity vs the released crate)
        run: cargo test -p tk-encode --features bench-baseline --test pipeline_oracle --test pipeline_decode_oracle

  # Fan-out: one job per manifest model, on its own 8-vCPU runner (isolated +
  # parallel), running the prebuilt binary, uploading a partial JSON. No
  # toolchain here — these jobs only fetch data + the binary. With a baseline
  # cache hit the binary skips all release timing (`--baseline-from`).
  bench:
    name: bench ${{ matrix.model }}
    needs: [plan, build]
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-pipeline-bench'
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.plan.outputs.models) }}
    runs-on:
      group: aws-general-8-plus
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Cache the fixture corpora + model tokenizers (one dataset@main mirror for all).
      # `make` guards each download by file existence, so a restored data/ makes the
      # fetch below a no-op. Keyed on the fetch inputs (Makefile fixture lists + model
      # manifest); bump either to force a refresh if the upstream dataset changes.
      - name: Cache fixtures + model tokenizers
        uses: actions/cache@v4
        with:
          path: tokenizers/data
          key: bench-data-${{ hashFiles('tokenizers/Makefile', 'tokenizers/tk-encode/examples/bench_models.json') }}

      - name: Download fixtures and model tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make fixtures models HF="uvx --from huggingface_hub hf"

      - name: Download prebuilt bench binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: bench-binaries
          path: tokenizers/target/release/examples

      - name: Download cached baseline numbers
        if: needs.plan.outputs.have_baseline == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: baseline-cache
          path: tokenizers

      - name: Run comparative benchmark (${{ matrix.model }})
        run: |
          chmod +x target/release/examples/fixture_bench
          args=(--model "${{ matrix.model }}")
          [ -f baseline_cache.json ] && args+=(--baseline-from baseline_cache.json)
          ./target/release/examples/fixture_bench "${args[@]}" \
            > "pipeline_bench_${{ matrix.model }}.json"
          cat "pipeline_bench_${{ matrix.model }}.json"

      - name: Upload model partial
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: partial-${{ matrix.model }}
          path: tokenizers/pipeline_bench_${{ matrix.model }}.json
          retention-days: 3

  # Fan-in: concatenate the model partials in manifest order, then render +
  # upload charts + update the PR, once.
  report:
    name: PipelineTokenizer vs latest release
    needs: [plan, bench]
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-pipeline-bench'
    runs-on:
      group: aws-general-8-plus
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # cairosvg (chart rendering) dlopens libcairo; the runner image doesn't ship it.
      # No Rust/libclang here — this job doesn't compile; it runs the prebuilt binaries.
      - name: Install libcairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2

      # Same data cache as the bench jobs. Only the model tokenizers are needed here
      # (gpt2.json for the binsize check); the fixture corpora aren't — the numbers
      # already live in the partial JSONs, but restoring the shared cache is a no-op fetch.
      - name: Cache fixtures + model tokenizers
        uses: actions/cache@v4
        with:
          path: tokenizers/data
          key: bench-data-${{ hashFiles('tokenizers/Makefile', 'tokenizers/tk-encode/examples/bench_models.json') }}

      - name: Download model tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make models HF="uvx --from huggingface_hub hf"

      - name: Download model partials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: partial-*
          merge-multiple: true
          path: tokenizers/partials

      - name: Merge model partials
        run: |
          python3 - <<'PY'
          import glob, json
          order = [e["name"] for e in
                   json.load(open('tk-encode/examples/bench_models.json'))]
          model_of = lambda f: f.rsplit('/', 1)[-1][len('pipeline_bench_'):-len('.json')]
          parts = sorted(glob.glob('partials/**/pipeline_bench_*.json', recursive=True),
                         key=lambda f: order.index(model_of(f)))
          merged = None
          for f in parts:
              d = json.load(open(f))
              if merged is None:
                  # `env` (cpu/glibc stamp) from the first partial: the jobs
                  # share a runner group, so one stamp stands for the run.
                  merged = {"baseline": d["baseline"], "env": d.get("env"), "models": []}
              merged["models"].extend(d["models"])
          if merged is None:
              raise SystemExit("no model partials found")
          json.dump(merged, open('pipeline_bench.json', 'w'))
          print(f"merged {len(parts)} partial(s) -> {len(merged['models'])} models")
          PY
          head -c 300 pipeline_bench.json; echo

      # Seed the release-baseline cache: this run had no cached numbers, so it
      # measured the release itself; publish the merged JSON under the plan
      # job's key so every following run skips the baseline timing. The full
      # bench JSON is stored as-is — cached-mode runs read only its baseline
      # fields.
      - name: Publish release-baseline cache
        if: needs.plan.outputs.have_baseline == 'false'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx --from huggingface_hub hf upload hf-internal-testing/tokenizers-bench \
            pipeline_bench.json "${{ needs.plan.outputs.baseline_path }}" --repo-type dataset \
            --commit-message "release baseline: ${{ needs.plan.outputs.baseline_path }}"

      - name: Download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: bench-binaries
          path: tokenizers/target/release/examples

      # Stripped size of a minimal encode program linking each implementation —
      # the "how much does this library add to my binary" number.
      - name: Measure binary sizes
        run: |
          # Built in the `build` job with DISTINCT feature sets (binsize_baseline WITH
          # `bench-baseline` → links the released crate; binsize_pipeline WITHOUT → the
          # real shipping config, none of the benchmark-only reference-regex deps). We
          # only run/strip/stat here — NEVER rebuild — so the sizes are exactly those
          # binaries; collapsing the features would corrupt the number.
          chmod +x target/release/examples/binsize_baseline target/release/examples/binsize_pipeline
          printf '{' > binary_sizes.json
          sep=''
          for key in baseline pipeline; do
            bin="target/release/examples/binsize_$key"
            "$bin" data/gpt2.json "The quick brown fox jumps 123."   # binary actually works
            strip -o "$bin.stripped" "$bin"
            printf '%s"%s": %s' "$sep" "$key" "$(stat -c %s "$bin.stripped")" >> binary_sizes.json
            sep=', '
          done
          printf '}\n' >> binary_sizes.json
          cat binary_sizes.json

      # "vs base branch": find the base branch's bench to diff this run against.
      #   1. Primary — the `pipeline-baseline` tag pins a base commit whose merged
      #      bench is cached on HF Hub (durable, survives artifact expiry).
      #   2. Fallback — before that tag exists (e.g. on this very PR, or any PR
      #      before the feature has merged + a base push), use the newest
      #      successful base-branch bench *artifact*. Always available, so the
      #      comparison shows up without any manual seeding.
      # Skipped (has_base=false) only when neither exists or both point at this
      # same commit; the release charts render regardless.
      - name: Resolve base-branch baseline
        id: base
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # 1. tag -> HF Hub JSON
          base_sha=$(git ls-remote origin refs/tags/pipeline-baseline | awk '{print $1}' | head -1)
          if [ -n "$base_sha" ] && [ "$base_sha" != "$CUR_SHA" ]; then
            uvx --from huggingface_hub hf download hf-internal-testing/tokenizers-bench \
              "baselines/pipeline-$base_sha.json" --repo-type dataset --local-dir base_dir 2>/dev/null || true
            if [ -f "base_dir/baselines/pipeline-$base_sha.json" ]; then
              {
                echo "has_base=true"
                echo "base_json=base_dir/baselines/pipeline-$base_sha.json"
                echo "base_ref=${base_sha:0:9}"
              } >> "$GITHUB_OUTPUT"
              echo "Base baseline from pipeline-baseline tag ($base_sha)."; exit 0
            fi
          fi
          # 2. fallback -> newest successful base-branch bench artifact
          latest=$(gh run list --workflow pipeline-bench.yml \
            --branch feat/train_encode_split --status success --limit 1 \
            --json databaseId,headSha \
            --jq 'if length > 0 then "\(.[0].databaseId) \(.[0].headSha)" else "" end' \
            2>/dev/null || true)
          run_id=${latest%% *}
          run_sha=${latest##* }
          if [ -n "$run_id" ] && [ "$run_sha" != "$CUR_SHA" ]; then
            gh run download "$run_id" --name pipeline-bench --dir base_dir 2>/dev/null || true
            f=$(find base_dir -name pipeline_bench.json 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              {
                echo "has_base=true"
                echo "base_json=$f"
                echo "base_ref=${run_sha:0:9}"
              } >> "$GITHUB_OUTPUT"
              echo "Base baseline from base-branch run $run_id artifact ($run_sha)."; exit 0
            fi
          fi
          echo "No base baseline available (no tag, no base-branch artifact) — comparison skipped."
          echo "has_base=false" >> "$GITHUB_OUTPUT"

      - name: Render report
        run: |
          base_url="https://huggingface.co/datasets/hf-internal-testing/tokenizers-bench/resolve/main/charts"
          base_args=""
          if [ "${{ steps.base.outputs.has_base }}" = "true" ]; then
            base_args="--base-bench ${{ steps.base.outputs.base_json }} --base-ref ${{ steps.base.outputs.base_ref }}"
          fi
          python3 ${{ github.workspace }}/.github/scripts/render_pipeline_bench.py \
            pipeline_bench.json \
            --subtitle "whole corpus · ~10 kB chunks · cold caches · add_special_tokens on · 2/4-thread sweep per group" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --img-base "$base_url" \
            --run-id "${{ github.run_id }}" \
            --binary-sizes binary_sizes.json \
            $base_args
          uvx --with cairosvg python -c "
          import cairosvg, glob
          for f in glob.glob('pipeline_bench_*.svg'):
              cairosvg.svg2png(url=f, write_to=f[:-4] + '.png', scale=2)
          "
      - name: Upload charts to HF Hub
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Stage the PNGs under their Hub names, then upload the whole folder in ONE
          # `hf upload` commit — instead of a `uvx hf upload` per file, which spawned
          # ~30 envs and did as many serial round-trips.
          mkdir -p charts_upload
          for png in pipeline_bench_*.png; do
            slug="${png#pipeline_bench_}"   # <slug>.png
            slug="${slug%.png}"             # <slug>
            cp "$png" "charts_upload/pipeline-${{ github.run_id }}-${slug}.png"
          done
          uvx --from huggingface_hub hf upload hf-internal-testing/tokenizers-bench \
            charts_upload charts --repo-type dataset \
            --commit-message "charts: pipeline-bench run ${{ github.run_id }}"

      - name: Write step summary
        run: cat pipeline_bench.md >> "$GITHUB_STEP_SUMMARY"

      # Maintain a marker-delimited benchmark section in the PR *description*.
      # upsert_pr_section.py replaces the block in place if present, else appends
      # it, so the author's own description is preserved. Target PR: the labeled
      # PR, else the dispatch input, else #2119 for pushes to feat/train_encode_split
      # (retire that default when #2119 lands).
      - name: Update PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          pr="${PR_FROM_EVENT:-$PR_FROM_INPUT}"
          if [ -z "$pr" ] && [ "$IS_PUSH" = "true" ]; then pr="2119"; fi
          if [ -z "$pr" ]; then echo "No target PR — skipping description update."; exit 0; fi
          gh api "repos/${{ github.repository }}/pulls/$pr" \
            --jq '.body // ""' > pr_body.md
          python3 ${{ github.workspace }}/.github/scripts/upsert_pr_section.py \
            pr_body.md pipeline_bench.md > pr_body_new.md
          gh api "repos/${{ github.repository }}/pulls/$pr" \
            -X PATCH -F "body=@pr_body_new.md"

      # Momentary-button behaviour: drop the label so re-adding it re-runs. Runs
      # on any outcome so the label never sticks; || true since a raced run may
      # have already removed it.
      - name: Remove the trigger label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-pipeline-bench" \
            -X DELETE || true

      # Pipeline encode ids (`ids_match`) and decoded text (`text_match`) must both
      # match the released crate. Null when the release can't load a model (no
      # reference, so no gate) or when the pipeline can't decode it yet — those
      # render as "pending" rather than failing here.
      - name: Fail on parity mismatches
        run: |
          python3 -c "
          import json, sys
          models = json.load(open('pipeline_bench.json'))['models']
          bad = lambda gate: [f\"{m['model']}/{r['fixture']}\" for m in models
                              for r in m['results'] if r.get(gate) is False]
          msg = []
          for gate, what in (('ids_match', 'ids'), ('text_match', 'decoded text')):
              names = bad(gate)
              if names:
                  msg.append(f'{what} diverges from the release on: {names}')
          sys.exit('; '.join(msg) if msg else 0)
          "

      # Establish/refresh the base-branch baseline: on a push to
      # feat/train_encode_split, cache this commit's merged bench on HF Hub and
      # force-move the `pipeline-baseline` tag to it. Runs only after the id check
      # passes, so a broken base never becomes the baseline. The tag push is a
      # refs/tags update — it does NOT match the `push: branches` trigger, so no
      # re-run loop. Uses the checkout's persisted GITHUB_TOKEN (contents: write).
      - name: Publish base-branch baseline
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          uvx --from huggingface_hub hf upload hf-internal-testing/tokenizers-bench \
            pipeline_bench.json "baselines/pipeline-$sha.json" --repo-type dataset
          git tag -f pipeline-baseline "$sha"
          git push -f origin "refs/tags/pipeline-baseline"
          echo "Published baseline for $sha and moved the pipeline-baseline tag."

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipeline-bench
          path: |
            tokenizers/pipeline_bench.json
            tokenizers/binary_sizes.json
            tokenizers/pipeline_bench.md
            tokenizers/pipeline_bench_*.svg
            tokenizers/pipeline_bench_*.png
          retention-days: 30
