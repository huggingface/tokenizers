name: Python golden tests

# The golden suite (bindings/python/tests/golden) drives the bindings through
# the transformers stack. Two runs of the same tests:
#   release — on the tokenizers wheel transformers resolves; always required green
#   in-tree — on the 1.0 bindings build; informational while the rewrite is
#             incomplete, its failures enumerate what is still missing

on:
  push:
    branches:
      - main
    paths-ignore:
      - bindings/node/**
  pull_request:
    paths-ignore:
      - bindings/node/**

env:
  # CI runners have no GPU: resolve torch from the CPU index instead of
  # pulling ~2 GB of CUDA wheels.
  UV_TORCH_BACKEND: cpu
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  release:
    name: transformers v5 on released tokenizers (must pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Hub downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/huggingface
          key: golden-hub-${{ hashFiles('bindings/python/tests/golden/*') }}
          restore-keys: golden-hub-

      - name: Run the golden suite
        working-directory: ./bindings/python
        run: make golden-release

  in-tree:
    name: transformers v5 on the in-tree build (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: bindings/python
          shared-key: python
          cache-bin: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Hub downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/huggingface
          key: golden-hub-${{ hashFiles('bindings/python/tests/golden/*') }}
          restore-keys: golden-hub-

      - name: Run the golden suite
        working-directory: ./bindings/python
        run: |
          set -o pipefail
          make golden 2>&1 | tee golden.log

      # The suite's whole point while the rewrite is in progress: surface
      # what still fails, without hunting through the log.
      - name: Post the failure overview to the step summary
        if: always()
        working-directory: ./bindings/python
        run: |
          {
            echo '## Golden suite on the in-tree build'
            echo '```'
            sed -n '/short test summary info/,$p' golden.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
