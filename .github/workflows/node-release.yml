name: Node Release

env:
  APP_NAME: tokenizers
  MACOSX_DEPLOYMENT_TARGET: '12.0'


on:
  push:
    tags:
      - v*
    branches:
      - release/*
  workflow_dispatch:

permissions: {}

jobs:
  version-match:
    name: Assert the ref and version match
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Checked on release branches too, so the dry run catches a missed bump before the tag.
      - run: |
          case "$GITHUB_REF" in
            refs/tags/v*) expected=${GITHUB_REF_NAME#v} ;;
            refs/heads/release/v*) expected=${GITHUB_REF_NAME#release/v} ;;
            *) echo "No version in $GITHUB_REF, skipping"; exit 0 ;;
          esac
          actual=$(jq -r .version bindings/node/package.json)
          if [ "$actual" != "$expected" ]; then
            echo "::error::bindings/node/package.json is $actual, $GITHUB_REF expects $expected"
            exit 1
          fi

  build:
    needs: version-match
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              yarn build --target x86_64-apple-darwin
              strip -x *.node
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              yarn build --target aarch64-apple-darwin
              strip -x *.node
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: yarn build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: yarn build --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c
            build: |
              set -e
              yarn build --target x86_64-unknown-linux-gnu
              strip *.node
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: yarn build --target x86_64-unknown-linux-musl --cross-compile
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn build --target aarch64-unknown-linux-gnu --cross-compile
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: yarn build --target aarch64-unknown-linux-musl --cross-compile
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: yarn build --target armv7-unknown-linux-gnueabihf --cross-compile
          - host: ubuntu-latest
            target: aarch64-linux-android
            build: yarn build --target aarch64-linux-android
          - host: ubuntu-latest
            target: armv7-linux-androideabi
            build: yarn build --target armv7-linux-androideabi
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        if: ${{ !matrix.settings.docker }}
        with:
          package-manager-cache: false
          node-version: lts/*

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        working-directory: ./bindings/node
        run: yarn install --immutable

      - name: Setup zig
        if: ${{ !matrix.settings.docker && contains(matrix.settings.build, '--cross-compile') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          use-cache: false
          # Pin: without a version the action installs zig master (nightly),
          # whose `zig env` output has drifted and broken the parsers in both
          # napi-rs/cli and cargo-zigbuild.
          version: 0.16.0

      - name: Verify zig
        if: ${{ !matrix.settings.docker && contains(matrix.settings.build, '--cross-compile') }}
        run: zig version && which zig

      - name: Build native (host)
        if: ${{ !matrix.settings.docker }}
        working-directory: ./bindings/node
        run: ${{ matrix.settings.build }}

      - name: Build native (docker)
        if: ${{ matrix.settings.docker }}
        env:
          IMAGE: ${{ matrix.settings.docker }}
          BUILD: ${{ matrix.settings.build }}
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/build" -w /build/bindings/node \
            -e BUILD --entrypoint sh "$IMAGE" -c '
              set -e
              rustup update stable && rustup default stable
              corepack enable
              yarn install --immutable
              eval "$BUILD"'

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  universal-macOS:
    permissions:
      contents: read
    name: Build universal macOS binary
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bindings-x86_64-apple-darwin
          path: ./artifacts
      - name: Download macOS aarch64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bindings-aarch64-apple-darwin
          path: ./artifacts
      - name: Combine into universal binary
        # napi-rs/cli v3 renamed `napi universal` -> `napi universalize`
        # and dropped `--dir`; it now expects the npm/<triple>/ layout
        # populated by `napi artifacts`. Cheaper to lipo directly — that's
        # exactly what the wrapper does internally.
        run: |
          lipo -create -output "${APP_NAME}.darwin-universal.node" \
            "artifacts/${APP_NAME}.darwin-x64.node" \
            "artifacts/${APP_NAME}.darwin-arm64.node"
      - name: Upload universal artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bindings-universal-apple-darwin
          path: ${{ env.APP_NAME }}.darwin-universal.node
          if-no-files-found: error

  fixtures:
    # Fetched once here so the test matrix needs neither make nor uv, and the Makefile stays the only fixture list.
    name: Fetch test fixtures
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fetch test fixtures
        working-directory: ./bindings/node
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make data HF="uvx --from huggingface_hub hf"
      - name: Upload test fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: node-test-fixtures
          path: bindings/node/data
          if-no-files-found: error
  test:
    # Loads each shipped binary on a machine that can run it and runs the test suite.
    # armv7 and Android would need emulation and stay untested.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          # On macOS the loader picks darwin-universal first, so that is the binary users run.
          - host: macos-latest
            target: universal-apple-darwin
            arch: arm64
          - host: macos-latest
            target: universal-apple-darwin
            arch: x64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: node:lts-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker: node:lts-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    name: test - ${{ matrix.settings.target }} (${{ matrix.settings.arch || 'docker' }})
    runs-on: ${{ matrix.settings.host }}
    needs:
      - build
      - universal-macOS
      - fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          package-manager-cache: false
          node-version: lts/*
          architecture: ${{ matrix.settings.arch }}
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ./bindings/node
      - name: Download test fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: node-test-fixtures
          path: ./bindings/node/data
      - name: Test (host)
        if: ${{ !matrix.settings.docker }}
        working-directory: ./bindings/node
        run: npm test
      - name: Test (docker)
        if: ${{ matrix.settings.docker }}
        env:
          IMAGE: ${{ matrix.settings.docker }}
        run: docker run --rm -v "$PWD/bindings/node:/build" -w /build "$IMAGE" npm test

  package:
    # Runs on every trigger, so release-branch pushes exercise the whole assembly; only the
    # `publish` job below is tag-gated, and it publishes this exact tarball.
    permissions:
      contents: read
    name: Package
    runs-on: ubuntu-latest
    needs:
      - build
      - universal-macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          package-manager-cache: false
          node-version: lts/*
      - name: Install dependencies
        working-directory: ./bindings/node
        run: yarn install --immutable
      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bindings-*
          path: ./bindings/node/artifacts
      - name: Create npm/<triple> dirs
        # `yarn artifacts` (napi artifacts) writes each `.node` file into
        # `npm/<triple>/` and fails with ENOENT if the dir is missing.
        # The dirs are not checked in: `create-npm-dirs` generates them
        # from `napi.targets` in package.json.
        working-directory: ./bindings/node
        run: npx napi create-npm-dirs

      - name: Move artifacts
        # `napi artifacts` copies every discovered `.node` binary into the
        # root workspace (in addition to the per-platform npm/<triple>/
        # directories). Because package.json `files` includes `*.node`,
        # those root-level binaries are what `npm pack` will include.
        working-directory: ./bindings/node
        run: yarn artifacts
      - name: Pack
        working-directory: ./bindings/node
        run: npm pack --ignore-scripts
      - name: Verify package contents
        working-directory: ./bindings/node
        run: |
          tar tzf tokenizers-*.tgz
          expected=$(jq '.napi.targets | length' package.json)
          actual=$(tar tzf tokenizers-*.tgz | grep -c '\.node$')
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::package has $actual .node files, napi.targets lists $expected"
            exit 1
          fi
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: bindings/node/tokenizers-*.tgz
          if-no-files-found: error

  publish:
    # Tag pushes only: release branches and workflow_dispatch stop after `package`.
    # Prerelease tags publish too, but take the `next` dist-tag instead of `latest`.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      # Trusted Publishing: the job mints an OIDC token that npm exchanges for a
      # short-lived publish token, so there is no long-lived NPM_TOKEN secret. The
      # same id-token also signs the provenance attestation.
      contents: read
      id-token: write
    name: Publish
    environment: release
    runs-on: ubuntu-latest
    needs:
      - package
      - test
    steps:
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          package-manager-cache: false
          node-version: lts/*
          # No registry-url: it writes an .npmrc with a ${NODE_AUTH_TOKEN}
          # placeholder, which Trusted Publishing has nothing to fill in.
      - name: Ensure npm supports Trusted Publishing
        # OIDC publishing landed in npm 11.5.1; setup-node's bundled npm may be older.
        run: npm install -g npm@^11.5.1
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
      - name: Publish
        run: |
          TAG=latest
          [[ "$GITHUB_REF_NAME" == *-* ]] && TAG=next
          npm publish ./tokenizers-*.tgz --access public --provenance --ignore-scripts --tag "$TAG"
