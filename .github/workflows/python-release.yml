name: Python Release

# Default wheels are abi3-py310: one binary per platform covers CPython
# 3.10–3.14. Free-threaded interpreters (3.13t/3.14t) get their own
# interpreter-specific wheels (flavor: ft), built without the default `abi3`
# cargo feature. `workflow_dispatch` runs the full matrix without releasing —
# use it to exercise the exotic targets before tagging.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: us-east-1
  DIST_DIR: ${{ github.sha }}

jobs:
  lock_exists:
    runs-on: ubuntu-latest
    name: Cargo.lock
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Cargo.lock exists
        run: cat Cargo.lock
        working-directory: ./bindings/python

  build:
    name: build on ${{ matrix.platform || matrix.os }} (${{ matrix.target }} - ${{ matrix.manylinux || 'auto' }} - ${{ matrix.interpreter || '3.14' }})
    needs: [lock_exists]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        target: [x86_64, aarch64]
        manylinux: [auto]
        # `flavor` discriminates abi3 wheels from free-threaded (3.14t,
        # non-abi3) wheels so the ft include: entries below create new
        # matrix cells instead of merging with the abi3 combos.
        flavor: [abi3]
        include:
          - os: ubuntu
            platform: linux
          - os: windows
            ls: dir
            interpreter: "3.14"
          - os: windows
            ls: dir
            target: x86_64
            python-architecture: x64
            python-install: "3.14"
            interpreter: "3.14"
          - os: windows
            ls: dir
            target: i686
            python-architecture: x86
            python-install: "3.14"
            interpreter: "3.14"
          - os: windows-11-arm
            ls: dir
            target: aarch64
            python-architecture: arm64
            python-install: "3.14"
            interpreter: "3.14"
            smoke: true
          - os: macos
            target: aarch64
            interpreter: "3.14"
          - os: ubuntu
            platform: linux
            target: i686
          - os: ubuntu
            platform: linux
            target: aarch64

          - os: ubuntu
            platform: linux
            target: armv7
            interpreter: "3.14"
          # musllinux
          - os: ubuntu
            platform: linux
            target: x86_64
            manylinux: musllinux_1_1
          - os: ubuntu
            platform: linux
            target: aarch64
            manylinux: musllinux_1_1
          - os: ubuntu
            platform: linux
            target: ppc64le
            interpreter: "3.14"
          - os: ubuntu
            platform: linux
            target: s390x
            interpreter: "3.14"

          # --- Free-threaded Python wheels (3.13t and 3.14t) --------------
          # `flavor: ft` drops the default `abi3` cargo feature (see the
          # maturin args below), producing interpreter-specific cp313t/cp314t
          # wheels. linux container builds get the ft interpreters from the
          # docker image, so `python-install` is unset there; macOS/windows
          # host builds need it so setup-python actually installs them.
          - { os: ubuntu, platform: linux, target: x86_64,  manylinux: auto,           flavor: ft, interpreter: "3.13t" }
          - { os: ubuntu, platform: linux, target: x86_64,  manylinux: auto,           flavor: ft, interpreter: "3.14t" }
          - { os: ubuntu, platform: linux, target: aarch64, manylinux: auto,           flavor: ft, interpreter: "3.13t" }
          - { os: ubuntu, platform: linux, target: aarch64, manylinux: auto,           flavor: ft, interpreter: "3.14t" }
          - { os: ubuntu, platform: linux, target: x86_64,  manylinux: musllinux_1_1,  flavor: ft, interpreter: "3.13t" }
          - { os: ubuntu, platform: linux, target: x86_64,  manylinux: musllinux_1_1,  flavor: ft, interpreter: "3.14t" }
          - { os: ubuntu, platform: linux, target: aarch64, manylinux: musllinux_1_1,  flavor: ft, interpreter: "3.13t" }
          - { os: ubuntu, platform: linux, target: aarch64, manylinux: musllinux_1_1,  flavor: ft, interpreter: "3.14t" }
          - { os: macos,                   target: x86_64,  manylinux: auto,           flavor: ft, interpreter: "3.13t", python-install: "3.13t" }
          - { os: macos,                   target: x86_64,  manylinux: auto,           flavor: ft, interpreter: "3.14t", python-install: "3.14t" }
          - { os: macos,                   target: aarch64, manylinux: auto,           flavor: ft, interpreter: "3.13t", python-install: "3.13t", smoke: true }
          - { os: macos,                   target: aarch64, manylinux: auto,           flavor: ft, interpreter: "3.14t", python-install: "3.14t", smoke: true }
          - { os: windows, ls: dir, target: x86_64, manylinux: auto, python-architecture: x64, python-install: "3.13t", interpreter: "3.13t", flavor: ft, smoke: true }
          - { os: windows, ls: dir, target: x86_64, manylinux: auto, python-architecture: x64, python-install: "3.14t", interpreter: "3.14t", flavor: ft, smoke: true }

          # --- Smoke-test flags --------------------------------------------
          # `smoke: true` marks the cells whose wheel the runner itself can
          # import (matching OS/arch/libc). Cross-compiled and musl wheels
          # can't run here; twine check still covers their metadata.
          - { os: ubuntu, target: x86_64, manylinux: auto, flavor: abi3, smoke: true }
          - { os: macos,  target: aarch64,                 flavor: abi3, smoke: true }
          - { os: windows, target: x86_64,                 flavor: abi3, smoke: true }
        exclude:
          # Built by the windows-11-arm include cell instead (needs an arm
          # runner; the plain windows runner is x64).
          - os: windows
            target: aarch64

    runs-on: ${{
        matrix.os == 'windows-11-arm' && matrix.os ||
        format('{0}-latest', matrix.os)
      }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: set up python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-install || '3.14' }}
          architecture: ${{ matrix.python-architecture || 'x64' }}

      - run: pip install -U twine

      - name: build wheels
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38  # v1.51.0
        with:
          target: ${{ matrix.target }}
          working-directory: ./bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          # `flavor=ft` drops the default `abi3` cargo feature so the wheel
          # is non-abi3 (free-threaded Python can't load limited-API
          # extensions). `flavor=abi3` builds use defaults.
          args: >-
            --release --out dist
            --interpreter ${{ matrix.interpreter || '3.14' }}
            ${{ matrix.flavor == 'ft' && '--no-default-features' || '' }}
          rust-toolchain: stable
          sccache: false
          docker-options: -e CI

      - run: ${{ matrix.ls || 'ls -lh' }} dist/
        working-directory: ./bindings/python

      - run: twine check --strict dist/*
        working-directory: ./bindings/python

      - name: Install uv
        if: matrix.smoke
        uses: astral-sh/setup-uv@v6

      # abi3 wheels are deliberately smoked on 3.12 — not the 3.14 they were
      # built with — to prove the stable-ABI claim. ft wheels run on their
      # exact interpreter and must keep the GIL disabled.
      - name: Smoke test the wheel
        if: matrix.smoke
        working-directory: ./bindings/python
        shell: bash
        run: |
          uv venv .smoke --python ${{ matrix.flavor == 'ft' && matrix.interpreter || '3.12' }}
          source .smoke/bin/activate 2>/dev/null || source .smoke/Scripts/activate
          uv pip install dist/*.whl
          python -c "
          import sys
          import tokenizers
          print('tokenizers', tokenizers.__version__, 'on', sys.version)
          tok = tokenizers.Tokenizer(tokenizers.models.BPE())
          tok.pre_tokenizer = tokenizers.pre_tokenizers.Whitespace()
          tok.train_from_iterator(['smoke test'] * 4, trainer=tokenizers.trainers.BpeTrainer(show_progress=False))
          assert tok.encode('smoke', add_special_tokens=False).dtype == 'uint32'
          gil = getattr(sys, '_is_gil_enabled', lambda: True)()
          assert not ('${{ matrix.flavor }}' == 'ft' and gil), 'free-threaded wheel re-enabled the GIL'
          print('smoke OK (gil enabled:', gil, ')')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi_files-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}-${{ matrix.flavor || 'abi3' }}-${{ matrix.interpreter || 'default' }}
          path: ./bindings/python/dist
  build-sdist:
    name: build sdist
    needs: [lock_exists]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38  # v1.51.0
        with:
          working-directory: ./bindings/python
          command: sdist
          args: --out dist
          rust-toolchain: stable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi_files-sdist
          path: ./bindings/python/dist


  upload_package:
    name: Upload package to PyPi
    runs-on: ubuntu-latest
    needs: [build, build-sdist]
    # Tags only: a workflow_dispatch run is a build dry-run, never a release.
    if: startsWith(github.ref, 'refs/tags/')
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN_DIST }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
          architecture: x64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./bindings/python/dist
          merge-multiple: true

      # TODO(release): re-enable before shipping 1.0 — deactivated while the
      # abi3 CI rework is validated. Until then, tagging builds and checks
      # everything but publishes nothing.
      # - name: Upload to PyPi
      #   working-directory: ./bindings/python
      #   run: |
      #     pip install twine
      #     twine upload dist/* -u __token__ -p "$PYPI_TOKEN"
